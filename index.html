<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>向殭屍開炮 - v6.1 範圍技整合版</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 22%,#131c33 0%,#050a16 52%,#000 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;color:#f8fafc}
#game-wrap{position:fixed;inset:0;margin:auto;width:min(450px,94vw,calc(94vh * 450 / 800));height:min(800px,94vh,calc(94vw * 800 / 450))}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-5px,4px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-5px)}80%{transform:translate(4px,5px)}100%{transform:translate(0,0)}}
.shake{animation:shake .32s cubic-bezier(.36,.07,.19,.97) both}
canvas{display:block;width:100%;height:100%;background:#020617;border-radius:20px;box-shadow:0 0 0 1px rgba(56,189,248,.10),0 18px 60px rgba(0,0,0,.65),0 0 70px rgba(56,189,248,.10),inset 0 0 90px rgba(0,0,0,.45);touch-action:none;cursor:crosshair}
#hud-buttons{position:absolute;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:flex-end;z-index:30;max-width:62%}
.mini-btn{background:rgba(8,15,30,.82);color:#e2e8f0;border:1px solid rgba(51,65,85,.9);border-radius:9px;padding:6px 8px;font-size:13px;line-height:1;cursor:pointer;transition:.15s;backdrop-filter:blur(6px)}
.mini-btn:hover{border-color:#38bdf8;background:rgba(30,41,59,.9);box-shadow:0 0 14px rgba(56,189,248,.25)}
.mini-btn.on{border-color:#38bdf8;color:#7dd3fc}
.mini-range{width:52px;accent-color:#38bdf8;background:rgba(8,15,30,.82);border:1px solid rgba(51,65,85,.9);border-radius:9px;height:28px;padding:0 3px}
#skills{position:absolute;bottom:12px;left:10px;display:none;flex-wrap:wrap;gap:6px;z-index:15}
#game-wrap.one-hand #skills{left:auto;right:10px}
.skill-btn{width:46px;height:46px;border-radius:12px;background:linear-gradient(180deg,rgba(15,23,42,.9),rgba(4,9,20,.92));border:1px solid var(--scb,#1e293b);color:var(--sc,#38bdf8);font-size:15px;font-weight:800;line-height:1;cursor:pointer;position:relative;overflow:hidden;backdrop-filter:blur(6px);transition:transform .12s,box-shadow .12s;box-shadow:inset 0 0 12px rgba(0,0,0,.4)}
.skill-btn:hover{transform:translateY(-2px);box-shadow:0 0 16px color-mix(in srgb,var(--sc) 45%,transparent),inset 0 0 12px rgba(0,0,0,.4)}
.skill-btn:active{transform:translateY(0) scale(.96)}
.skill-btn:disabled{opacity:.5;cursor:not-allowed}
.skill-btn .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-shadow:0 0 10px color-mix(in srgb,var(--sc) 60%,transparent)}
.skill-btn .hk{position:absolute;top:3px;left:4px;font-size:9px;font-weight:700;color:#94a3b8}
.skill-btn .cd-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(2,6,23,.72)}
.skill-btn .cd-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#facc15;text-shadow:0 1px 3px #000;pointer-events:none}
.skill-btn.cooling{color:#64748b}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;text-align:center;background:rgba(2,6,23,.9);color:#f8fafc;padding:20px;border-radius:20px;z-index:20;overflow:auto;backdrop-filter:blur(8px)}
.overlay.active{display:flex}
.overlay::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:20px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px);opacity:.2}
@keyframes neonPulse{from{text-shadow:0 0 12px rgba(56,189,248,.3),0 0 26px rgba(56,189,248,.2)}to{text-shadow:0 0 20px rgba(56,189,248,.6),0 0 46px rgba(56,189,248,.35),0 0 80px rgba(168,85,247,.28)}}
.overlay h1{margin:0 0 6px;font-size:28px;color:#38bdf8;animation:neonPulse 2.2s ease-in-out infinite alternate;letter-spacing:2px}
.overlay p{margin:0 0 10px;color:#cbd5e1;font-size:13.5px;line-height:1.5;white-space:pre-line}
#levelup-timer{margin:0 0 12px;font-size:13px;color:#facc15;font-weight:700;white-space:pre-line}
.btn-group{display:flex;flex-direction:column;gap:9px;width:100%;max-width:250px}
.btn{background:rgba(15,23,42,.92);color:#f8fafc;border:1px solid #38bdf8;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:bold;cursor:pointer;transition:.15s}
.btn:hover{background:#38bdf8;color:#020617;transform:translateY(-2px);box-shadow:0 0 18px currentColor}
.btn.easy{border-color:#4ade80;color:#4ade80}.btn.easy:hover{background:#4ade80;color:#020617}
.btn.hard{border-color:#f87171;color:#f87171}.btn.hard:hover{background:#f87171;color:#020617}
.btn.small{padding:9px 14px;font-size:13px}
.row{display:flex;gap:8px;width:100%;max-width:340px;justify-content:center;flex-wrap:wrap}
#cards{width:100%;max-width:360px;display:flex;flex-direction:column;gap:9px;max-height:54vh;overflow:auto}
.card{width:100%;text-align:left;background:linear-gradient(180deg,rgba(20,30,52,.94),rgba(9,15,28,.94));border:1px solid #2a3a55;color:#f8fafc;border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.card:hover{background:#1c2a44;border-color:#38bdf8;transform:translateY(-2px);box-shadow:0 0 18px rgba(56,189,248,.2)}
.card.disabled{opacity:.42;cursor:not-allowed}
.card.disabled:hover{background:linear-gradient(180deg,rgba(20,30,52,.94),rgba(9,15,28,.94));border-color:#2a3a55;transform:none;box-shadow:none}
.stat-card{cursor:default}.stat-card:hover{background:linear-gradient(180deg,rgba(20,30,52,.94),rgba(9,15,28,.94));border-color:#2a3a55;transform:none;box-shadow:none}
.card strong{display:block;margin-bottom:3px;color:#38bdf8;font-size:15px}
.card span{color:#cbd5e1;font-size:12.5px;line-height:1.45;white-space:pre-line}
#restart-btn{display:none;margin-top:12px;background:#38bdf8;color:#020617;border:none;border-radius:12px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer}
#restart-btn:hover{background:#7dd3fc}
.tip{margin-top:10px;color:#94a3b8;font-size:11.5px;line-height:1.6;text-align:left}
.meta-line{width:100%;max-width:360px;color:#cbd5e1;font-size:12.5px;margin:2px 0}
.meta-grid{width:100%;max-width:360px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:9px 0 12px}
.meta-btn{padding:7px 6px;font-size:11px;line-height:1.35;white-space:normal;text-align:center}
.meta-btn:disabled{opacity:.45;cursor:not-allowed}
.chassis-grid{width:100%;max-width:360px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.chassis-btn{padding:8px 4px;font-size:11px;line-height:1.3;white-space:normal;text-align:center;border-radius:10px}
.chassis-btn.sel{border-color:#38bdf8;background:rgba(56,189,248,.16);color:#7dd3fc}
.chassis-btn:disabled{opacity:.4;cursor:not-allowed}
.sect{width:100%;max-width:360px;text-align:left;color:#64748b;font-size:11px;letter-spacing:1.5px;margin:8px 0 4px;text-transform:uppercase}
:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.btn:hover,.card:hover,.skill-btn:hover{transform:none}.overlay h1{animation:none}}
</style>
</head>
<body>
<div id="game-wrap">
<canvas id="game" role="img" aria-label="遊戲畫布"></canvas>
<div id="hud-buttons">
  <button id="toggle-sound" class="mini-btn" title="音效">🔊</button>
  <input id="sound-vol" class="mini-range" type="range" min="0" max="1" step="0.05" aria-label="音效音量" />
  <button id="toggle-music" class="mini-btn" title="音樂">🎵</button>
  <input id="music-vol" class="mini-range" type="range" min="0" max="1" step="0.05" aria-label="音樂音量" />
  <button id="stats-btn" class="mini-btn" title="素質">📊</button>
  <button id="codex-btn" class="mini-btn" title="圖鑑">📖</button>
  <button id="settings-btn" class="mini-btn" title="設定">⚙</button>
  <button id="pause-btn" class="mini-btn" title="暫停">⏸</button>
</div>
<div id="skills"></div>

<div id="start-screen" class="overlay active">
  <h1>向殭屍開炮</h1>
  <p>v6.1｜範圍技整合｜寶箱限量｜地雷場｜狙擊｜無人機</p>
  <div id="meta-gold" class="meta-line"></div>
  <div id="high-stats" class="meta-line"></div>
  <div class="sect">底盤</div>
  <div class="chassis-grid" id="chassis-grid"></div>
  <div class="sect">永久升級</div>
  <div id="meta-upgrades" class="meta-grid"></div>
  <div class="sect">模式</div>
  <div class="row">
    <button class="mini-btn" id="mode-std" >一般</button>
    <button class="mini-btn" id="mode-daily">每日種子</button>
    <button class="mini-btn" id="mode-endless">無盡</button>
  </div>
  <div class="sect">難度</div>
  <div class="btn-group">
    <button class="btn easy" data-diff="easy">簡單 (Easy)</button>
    <button class="btn normal" data-diff="normal">普通 (Normal)</button>
    <button class="btn hard" data-diff="hard">困難 (Hard)</button>
  </div>
  <div class="tip">
    操作：滑鼠瞄準｜←→/AD 移動｜按住底部拖曳移動｜手機左下拖曳移動、其餘拖曳瞄準<br />
    技能 Q 域 E 盾 R 狂 F 雷 G 狙 H 靜 J 磁 K 機（可在 ⚙ 設定改鍵）<br />
    連擊超能槽：50 自動範圍技、100 自動 EMP｜每 3 波商店｜每 5 波 BOSS 與異變<br />
    寶箱：同屏最多 1～2 個、每波限量並有冷卻，避免一次太多造成 LAG
  </div>
</div>

<div id="overlay" class="overlay">
  <h1 id="overlay-title">升級選擇</h1>
  <p id="overlay-desc">選擇一個強化</p>
  <div id="levelup-timer"></div>
  <div id="cards"></div>
  <button id="restart-btn">返回主選單</button>
</div>
</div>

<script>
(() => {
"use strict";

/* ================= DOM ================= */
const gameWrap = document.getElementById("game-wrap");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 450, H = 800, FIXED_STEP = 1/60, HITBOX_SHRINK = 6;

const startScreen = document.getElementById("start-screen");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlay-title");
const overlayDesc = document.getElementById("overlay-desc");
const levelupTimerEl = document.getElementById("levelup-timer");
const cardsEl = document.getElementById("cards");
const restartBtn = document.getElementById("restart-btn");
const diffButtons = document.querySelectorAll(".btn[data-diff]");
const toggleSoundBtn = document.getElementById("toggle-sound");
const toggleMusicBtn = document.getElementById("toggle-music");
const pauseBtn = document.getElementById("pause-btn");
const statsBtn = document.getElementById("stats-btn");
const codexBtn = document.getElementById("codex-btn");
const settingsBtn = document.getElementById("settings-btn");
const soundVolEl = document.getElementById("sound-vol");
const musicVolEl = document.getElementById("music-vol");
const skillsEl = document.getElementById("skills");
const metaGoldEl = document.getElementById("meta-gold");
const highStatsEl = document.getElementById("high-stats");
const metaUpgradesEl = document.getElementById("meta-upgrades");
const chassisGridEl = document.getElementById("chassis-grid");
const modeBtns = { std: document.getElementById("mode-std"), daily: document.getElementById("mode-daily"), endless: document.getElementById("mode-endless") };

const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const isCoarse = window.matchMedia("(pointer: coarse)").matches;

const SETTINGS_KEY = "za-v6-settings";
const STATS_KEY = "za-v6-stats";

/* ================= 種子 RNG ================= */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let _rng = mulberry32(1);
let runSeed = 1;
function rnd(){ return _rng(); }
function setSeed(s){ runSeed = s >>> 0 || 1; _rng = mulberry32(runSeed); }
function dailySeed(){ const d=new Date(); return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); }

/* ================= 技能定義 ================= */
const SKILL_DEFS = [
  {key:"area",   label:"域", color:"#fde047", cd:34, name:"範圍技",     desc:"自動連段：黑洞吸引 → 軌道雷射 → 空襲爆燃"},
  {key:"shield", label:"盾", color:"#38bdf8", cd:25, name:"護盾",       desc:"高容量護盾，存在時減傷 38%"},
  {key:"frenzy", label:"狂", color:"#f59e0b", cd:20, name:"狂暴",       desc:"4 秒攻速提升且子彈必暴擊"},
  {key:"mines",  label:"雷", color:"#f87171", cd:22, name:"地雷場",     desc:"在防線前方放置 4 枚地雷，觸發爆炸與減速"},
  {key:"sniper", label:"狙", color:"#e2e8f0", cd:16, name:"狙擊",       desc:"發射一發高傷穿透狙擊彈，暴擊並減速"},
  {key:"stasis", label:"靜", color:"#22d3ee", cd:30, name:"時間靜止",   desc:"敵人凍結且受傷 +45%，結束時碎彈"},
  {key:"emp",    label:"磁", color:"#a78bfa", cd:26, name:"電磁脈衝",   desc:"清除敵彈、全场減速、重創遠程與召喚"},
  {key:"drone",  label:"機", color:"#4ade80", cd:28, name:"無人機",     desc:"召喚 2 架無人機自動掃射 8 秒"}
];
const SKILL_KEYS = SKILL_DEFS.map(s=>s.key);
const DEFAULT_KEYMAP = {area:"Q",shield:"E",frenzy:"R",mines:"F",sniper:"G",stasis:"H",emp:"J",drone:"K"};

function normalizeKeymap(){
  const def = DEFAULT_KEYMAP;
  const old = settings.keymap || {};
  const map = {
    area: old.area || old.nuclear || old.blackhole || old.airstrike || old.orbital || def.area,
    shield: old.shield || def.shield,
    frenzy: old.frenzy || def.frenzy,
    mines: old.mines || old.blackhole || def.mines,
    sniper: old.sniper || old.orbital || def.sniper,
    stasis: old.stasis || def.stasis,
    emp: old.emp || def.emp,
    drone: old.drone || def.drone
  };
  const used = new Set();
  const result = {};
  for(const k of SKILL_KEYS){
    let v = map[k] || def[k];
    v = String(v || "").toUpperCase();
    if(!v || used.has(v)){
      const candidates = [def[k], "Q","E","R","F","G","H","J","K","Z","X","C","V","B","N","M"];
      v = candidates.find(c=>!used.has(c)) || "";
    }
    if(v) used.add(v);
    result[k] = v;
  }
  settings.keymap = result;
}

/* ================= 設定 ================= */
const settings = {
  soundEnabled:true, musicEnabled:true, soundVol:0.55, musicVol:0.95,
  colorblind:false, autoAim:false, oneHand:false, hudScale:1, shakeOn:!prefersReducedMotion,
  quality:"auto", keymap:{...DEFAULT_KEYMAP}
};

const CONFIG = {
  maxEnemies:90,
  maxBullets:260,
  maxParticles:220,
  maxOrbs:50,
  maxEnemyBullets:80,
  maxDecals:70,
  levelupLimit:20,
  shopLimit:60,
  caps:{multishot:7,fireRateMin:0.09,bulletSpeedMax:900,freeze:4,pierce:8,aoe:150,explosionHeal:3,bounce:50,regen:6,lifesteal:15,healDropChance:0.55,waveHeal:0.18,armor:0.45,chain:4,homing:1.2,split:2,crit:0.45,pickup:65}
};

/* ================= 狀態 ================= */
let state="start", lastTime=0, accumulator=0, gameTime=0;
let wave=1, kills=0, gold=0, level=1, exp=0, expNeed=20;
let waveDuration=25, spawnTimer=0, spawnInterval=1.25, waveTimer=0, bossSpawnedInWave=false;
let enemies=[], bullets=[], particles=[], decals=[], orbs=[], enemyBullets=[], blackholes=[], airstrikes=[], fires=[], flashes=[];
let mines=[], drones=[];
let nextEnemyId=1, defense=null, buffCounts={};
let combo=0, comboTimer=0, maxCombo=0, totalDamage=0, superMeter=0, superFired=0;
let screenFlash=0, screenFlashColor="255,255,255", ambientTimer=0, hitStop=0;
let barricade={hp:0,maxHp:0};
let currentDifficulty=diffSettingsSafe(), mode="std";
let keys={}, targetX=W/2, usingPointer=false, pointerX=W/2, pointerY=H/2, hasPointerAim=false, mouseDown=false;
let joyActive=false, joyOriginX=W/4, joyX=W/4;
const pointerRoles=new Map();
let levelupInterval=null, levelupRemaining=0, levelupLastTick=0, currentChoices=[], levelBatch=1, afterLevelTarget=null, pendingLevels=0;
let shopInterval=null, shopRemaining=0, shopLastTick=0, currentShopItems=[];
let panelReturn="playing", rebinding=null;
let audioCtx=null, masterGain=null, sfxGain=null, musicGain=null, musicFilter=null, compressor=null, noiseBuffer=null;
let musicTimer=null, musicStep=0, nextNoteTime=0;
let sfxStamp={};
let meta={goldBank:0,hp:0,dmg:0,rate:0,speed:0,pickup:0,startGold:0,goldBonus:0,chassis:0,unlocked:[true,false,false],seen:{}};
let high={wave:0,kills:0,level:0,gold:0,dailyWave:0,endlessWave:0};

let waveModifiers=[], activeMutation=null, resonances=new Set(), rarePity=0, nextLevelupRareBoost=false, chainStormTimer=0;
let quality=1, fpsSamples=[], glowBudget=0, runSettled=false;
let waveBannerTimer=0, waveBannerText="", bossWarningTimer=0, lightningTimer=rand(4,10), lightningFlash=0, lightningX=W/2;
let objective=null, waveStats=null;

let chestActive=0, chestWaveCount=0, chestWaveLimit=2, chestCooldown=0;
function maxChestActive(){ return Math.min(2, 1 + Math.floor(Math.max(0, wave - 1) / 10)); }

function diffSettingsSafe(){ return {hpMult:1,speedMult:1,spawnMult:1,dmgMult:1}; }
const diffSettings={
  easy:{hpMult:0.62,speedMult:0.75,spawnMult:1.55,dmgMult:0.42},
  normal:{hpMult:1,speedMult:1,spawnMult:1,dmgMult:0.72},
  hard:{hpMult:1.75,speedMult:1.28,spawnMult:0.68,dmgMult:0.95}
};

const metaUpgrades=[
  {id:"hp",title:"初始生命 +15",base:55},{id:"dmg",title:"初始傷害 +1",base:40},
  {id:"rate",title:"初始攻速 +1.5%",base:70},{id:"speed",title:"初始彈速 +15",base:45},
  {id:"pickup",title:"吸取範圍 +5",base:50},{id:"startGold",title:"初始金幣 +15",base:60},
  {id:"goldBonus",title:"永久金幣收益 +20%",base:90}
];

const chassisDefs=[
  {id:0,name:"重裝底盤",cost:0,blurb:"厚血、寬散射、核彈加大、撞擊減傷 20%"},
  {id:1,name:"精密底盤",cost:400,blurb:"傷害與暴擊高、彈速快、軌道雷射 ×2.2、遠距加成、血量偏低"},
  {id:2,name:"工程底盤",cost:400,blurb:"自動回血、防線超厚、護盾強化、受擊回血"}
];

const bassPattern=[110,0,110,110,87.31,0,130.81,0,98,0,98,98,110,0,87.31,0];
const arpNotes=[220,261.63,329.63,261.63,293.66,349.23,440,349.23,392,440,587.33,440,329.63,392,523.25,392];

/* ================= 修飾 ================= */
const MULT_KEYS=["enemyHpMult","enemySpeedMult","enemyDamageMult","goldMult","expMult","pickupMult","defenseDamageTakenMult","defenseSpeedMult","playerDamageMult","playerFireRateMult","bulletSpeedMult","skillCdMult","orbSpeedMult","enemyCountMult"];
const ADD_KEYS=["enemyArmor","eliteChance","chestChance","bulletAoe","bulletFreeze","selfDamagePerSec","bomberWeight","healerWeight","rangedWeight","summonWeight","chargerWeight","shieldWeight","wraithWeight","juggernautWeight","hiveWeight"];
const FLAG_KEYS=["allSplit","normalSplit","eliteChest"];
function defaultMods(){const o={};for(const k of MULT_KEYS)o[k]=1;for(const k of ADD_KEYS)o[k]=0;for(const k of FLAG_KEYS)o[k]=false;return o;}
let globalMods=defaultMods(), waveMods=defaultMods(), effectiveMods=defaultMods();
function recalcEffectiveMods(){
  effectiveMods=defaultMods();
  for(const k of MULT_KEYS) effectiveMods[k]=globalMods[k]*waveMods[k];
  for(const k of ADD_KEYS) effectiveMods[k]=globalMods[k]+waveMods[k];
  for(const k of FLAG_KEYS) effectiveMods[k]=globalMods[k]||waveMods[k];
}

const modifierPool=[
 {id:"frenzy",title:"狂暴",desc:"敵人速度 +30%",weight:10,apply:m=>{m.enemySpeedMult*=1.3;}},
 {id:"armor",title:"護甲",desc:"敵人減傷 18%",weight:9,apply:m=>{m.enemyArmor+=0.18;}},

function roundRect(c,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+rr,y);c.lineTo(x+w-rr,y);c.quadraticCurveTo(x+w,y,x+w,y+rr);c.lineTo(x+w,y+h-rr);c.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);c.lineTo(x+rr,y+h);c.quadraticCurveTo(x,y+h,x,y+h-rr);c.lineTo(x,y+rr);c.quadraticCurveTo(x,y,x+rr,y);c.closePath();}

function weightedChoices(pool,count){
  const items=pool.map(b=>({...b,weight:b.weight||1})),result=[];
  while(result.length<count&&items.length){
    let total=0; for(const it of items) total+=it.weight;
    let r=rnd()*total,ci=0;
    for(let i=0;i<items.length;i++){ r-=items[i].weight; if(r<=0){ci=i;break;} }
    result.push(items[ci]); items.splice(ci,1);
  }
  return result;
}
function weightedOne(list){
  let total=0; for(const it of list) total+=it.weight;
  let r=rnd()*total;
  for(const it of list){ r-=it.weight; if(r<=0) return it.type; }
  return list[0].type;
}

function ensureAudio(){

  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  audioCtx=new AC();

  compressor.threshold.value=-12; compressor.knee.value=16; compressor.ratio.value=10;
  compressor.attack.value=0.003; compressor.release.value=0.25; compressor.connect(audioCtx.destination);
  masterGain=audioCtx.createGain(); masterGain.gain.value=0.9; masterGain.connect(compressor);

  musicFilter=audioCtx.createBiquadFilter(); musicFilter.type="lowpass"; musicFilter.frequency.value=20000; musicFilter.Q.value=0.7;
  musicFilter.connect(masterGain);

}

function playTone(freq,type,dur,vol,freqEnd=freq,dest=null,delay=0,absTime=null){
  if(!audioCtx) return;
  const d = dest || sfxGain;
  if(d===sfxGain && !settings.soundEnabled) return;
  if(d===musicGain && !settings.musicEnabled) return;
  const t=absTime!=null?absTime:audioCtx.currentTime+delay;
  const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(Math.max(1,freq),t);
  if(freqEnd!==freq) osc.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd),t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+Math.min(0.01,dur*0.2)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(d); osc.start(t); osc.stop(t+dur+0.02);
}
function playNoise(dur,vol,dest=null,delay=0){
  if(!audioCtx) return;
  const d=dest||sfxGain;
  if(d===sfxGain && !settings.soundEnabled) return;
  if(d===musicGain && !settings.musicEnabled) return;
  const t=audioCtx.currentTime+delay;
  const src=audioCtx.createBufferSource(); src.buffer=getNoiseBuffer();
  const g=audioCtx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(g); g.connect(d); src.start(t); src.stop(t+dur);
}

function musicScheduler(){
  if(!audioCtx||!settings.musicEnabled||!["playing","levelup","shop"].includes(state)){ musicTimer=null; return; }
  while(nextNoteTime<audioCtx.currentTime+0.15){
    const s=musicStep%16, dl=nextNoteTime-audioCtx.currentTime, bass=bassPattern[s];
    if(bass>0) playTone(bass,"square",0.22,0.10,bass,musicGain,dl);
    if(s%2===0){ playTone(arpNotes[s],"triangle",0.1,0.06,arpNotes[s],musicGain,dl); playNoise(0.025,0.015,musicGain,dl); }
    if(s%4===0) playTone(120,"sine",0.15,0.13,40,musicGain,dl);
    if(s%8===4) playNoise(0.08,0.07,musicGain,dl);
    if(wave>=8&&s%4===2){ const f=arpNotes[(s+4)%16]*2; playTone(f,"triangle",0.08,0.032,f,musicGain,dl); }
    if(wave>=12&&s%4===0) playTone(55,"sawtooth",0.2,0.065,35,musicGain,dl);
    if(defense && defense.hp/defense.maxHp<0.35 && s%4===0) playTone(46,"sine",0.22,0.16,30,musicGain,dl);
    nextNoteTime+=0.125; musicStep++;
  }
  musicTimer=setTimeout(musicScheduler,25);
}
function startMusic(){ if(!audioCtx||!settings.musicEnabled||musicTimer) return; musicStep=0; nextNoteTime=audioCtx.currentTime+0.05; musicScheduler(); }
function stopMusic(){ if(musicTimer){ clearTimeout(musicTimer); musicTimer=null; } }

const CELL=56, grid=new Map();
let _stamp=0;
function gkey(cx,cy){ return (cx+512)*2048+(cy+512); }
function buildGrid(){
  grid.clear();
  for(const e of enemies){
    if(e.dead) continue;
    const x0=Math.floor((e.x-e.radius)/CELL),x1=Math.floor((e.x+e.radius)/CELL);
    const y0=Math.floor((e.y-e.radius)/CELL),y1=Math.floor((e.y+e.radius)/CELL);
    for(let cx=x0;cx<=x1;cx++) for(let cy=y0;cy<=y1;cy++){ const k=gkey(cx,cy); let a=grid.get(k); if(!a) grid.set(k,a=[]); a.push(e); }
  }
}
const _q=[];
function queryRect(x0,y0,x1,y1){
  _q.length=0; _stamp++;
  const cx0=Math.floor(x0/CELL),cx1=Math.floor(x1/CELL),cy0=Math.floor(y0/CELL),cy1=Math.floor(y1/CELL);
  for(let cx=cx0;cx<=cx1;cx++) for(let cy=cy0;cy<=cy1;cy++){
    const a=grid.get(gkey(cx,cy)); if(!a) continue;
    for(const e of a) if(e._mk!==_stamp){ e._mk=_stamp; _q.push(e); }
  }
  return _q;
}
function queryRectCopy(x0,y0,x1,y1){ return queryRect(x0,y0,x1,y1).slice(); }

  meta.seen[typeKey]=true;

    boss:!!t.boss,wraith:!!t.wraith,juggernaut:!!t.juggernaut,hive:!!t.hive,chest:typeKey==="chest",

  });

function chooseEnemyType(){

  const delay=currentDifficulty.hpMult<1?3:currentDifficulty.hpMult>1.1?0:1;
  if(wave>=3+delay) add("fast",22);
  if(wave>=4+delay) add("tank",16);
  if(wave>=5+delay) add("splitter",16);
  if(wave>=6+delay) add("ghost",18);
  add("bomber",(wave>=7+delay?14:0)+effectiveMods.bomberWeight);
  if(wave>=8+delay) add("elite",10);
  add("shield",(wave>=9+delay?12:0)+effectiveMods.shieldWeight);
  add("healer",(wave>=10+delay?10:0)+effectiveMods.healerWeight);
  add("summoner",(wave>=11+delay?10:0)+effectiveMods.summonWeight);
  add("charger",(wave>=12+delay?14:0)+effectiveMods.chargerWeight);
  add("ranged",(wave>=13+delay?12:0)+effectiveMods.rangedWeight);
  if(wave>=15) add("elite",20);
  if(wave>=16) add("shield",18);
  add("juggernaut",(wave>=17+delay?10:0)+effectiveMods.juggernautWeight);
  add("wraith",(wave>=19+delay?12:0)+effectiveMods.wraithWeight);
  add("hive",(wave>=21+delay?10:0)+effectiveMods.hiveWeight);
  if(wave>=14) weights.normal+=10;
  if(wave>=18) weights.fast+=12;

/* 傷害數字聚合 */
const dmgPool=new Map(); let dmgFlush=0;
function addDamageText(x,y,value,color="#f8fafc",big=false){
  if(quality<=0.3||!Number.isFinite(value)) return;
  const k=((x/34)|0)+","+((y/34)|0)+","+color;
  let c=dmgPool.get(k);
  if(c){ c.sum+=value; c.n++; if(big) c.big=true; }
  else dmgPool.set(k,{x,y,sum:value,n:1,color,big});
}
function flushDamageText(){
  if(!dmgPool.size) return;
  for(const c of dmgPool.values()){
    if(particles.length>=particleLimit()) break;
    addParticle({type:"text",x:c.x,y:c.y,vy:-92,life:0.72,max:0.72,color:c.color,value:c.n>1?`${c.n}hit ${Math.round(c.sum)}`:Math.round(c.sum),big:!!c.big});
  }
  dmgPool.clear();
}
function spawnLine(x1,y1,x2,y2,color="#a78bfa"){ if(quality<=0.35) return; addParticle({type:"line",x1,y1,x2,y2,life:0.18,max:0.18,color}); }
function spawnLightning(x1,y1,x2,y2,color="#a78bfa"){
  if(quality<=0.35) return;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),steps=Math.max(3,Math.min(11,Math.floor(len/16)));
  let px=x1,py=y1;
  for(let i=1;i<=steps;i++){
    const t=i/steps; let nx=x1+dx*t,ny=y1+dy*t;

function chainLightning(x,y,count,damage,excludeIds=[],skillFlag=false){

function homingSteer(b,dt){
  const near=queryRectCopy(b.x-200,b.y-200,b.x+200,b.y+200);
  let target=null,best=180*180;
  for(const e of near){ if(e.dead) continue; const d=(e.x-b.x)**2+(e.y-b.y)**2; if(d<best){best=d;target=e;} }
  if(!target) return;
  const desired=Math.atan2(target.y-b.y,target.x-b.x),current=Math.atan2(b.vy,b.vx);
  let diff=desired-current;
  while(diff>Math.PI) diff-=Math.PI*2;
  while(diff<-Math.PI) diff+=Math.PI*2;
  const maxTurn=2.2*b.homing*dt,turn=clamp(diff,-maxTurn,maxTurn),speed=Math.hypot(b.vx,b.vy),na=current+turn;
  b.vx=Math.cos(na)*speed; b.vy=Math.sin(na)*speed;
}
function segmentCircleHit(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1,dy=y2-y1,fx=x1-cx,fy=y1-cy,a=dx*dx+dy*dy;
  if(a===0){ const d2=fx*fx+fy*fy; return d2<=r*r?0:-1; }
  let t=clamp(-(fx*dx+fy*dy)/a,0,1);
  const px=x1+dx*t,py=y1+dy*t,ddx=px-cx,ddy=py-cy;
  return ddx*ddx+ddy*ddy<=r*r?t:-1;
}

function pickBuff(b){
  if(state!=="levelup") return;
  if(b.isMax&&b.isMax()) return;
  stopLevelupCountdown(); ensureDefense();
  const times=(b.rarity==="legendary")?1:levelBatch;
  for(let i=0;i<times;i++) b.apply();
  buffCounts[b.id]=(buffCounts[b.id]||0)+times;
  if(b.rarity&&b.rarity!=="common") rarePity=0; else rarePity++;
  pendingLevels=Math.max(0,pendingLevels-levelBatch);
  checkResonances(); ensureDefense();
  spawnParticles(defense.x,defense.y,"#38bdf8",12,180); spawnRing(defense.x,defense.y,55,"#38bdf8");
  finishLevelUp();
}
function finishLevelUp(){
  hideOverlay(); state="playing"; updateMusicPlayback(); updateSkillButtons();
  if(pendingLevels>0) openLevelUp(afterLevelTarget);
  else if(afterLevelTarget==="shop"){ afterLevelTarget=null; openShop(); }
}
function checkLevelUp(){
  if(state!=="playing") return;
  if(!Number.isFinite(exp)) exp=0;
  if(!Number.isFinite(expNeed)||expNeed<=0) expNeed=20;
  while(exp>=expNeed){ exp-=expNeed; level++; expNeed=Math.floor(expNeed*1.24+9); pendingLevels++; SFX.level(); }
  if(pendingLevels>0&&(enemies.length<12||pendingLevels>=4)) openLevelUp();
}

function openLevelUp(target){
  ensureDefense();
  const pool=getLevelUpPool(), evo=getEvolutionPool();
  if(pool.length===0&&evo.length===0){ heal(defense.maxHp*0.5,true); pendingLevels=Math.max(0,pendingLevels-1); finishLevelUp(); return; }
  afterLevelTarget=target||null;
  levelBatch=Math.max(1,Math.min(3,pendingLevels));
  state="levelup";
  currentChoices=weightedChoices(pool,3);
  if(evo.length>0&&(nextLevelupRareBoost||_rng()<0.65)){
    const e=evo[Math.floor(_rng()*evo.length)];
    currentChoices.unshift({id:e.id,title:e.title,desc:e.desc+"（進化）",weight:99,rarity:"legendary",isMax:()=>false,apply:()=>{defense.evolutions[e.id]=true;}});

}

/* ================= BOSS ================= */
function checkBossPhase(e){
  const ratio=e.hp/e.maxHp;
  if(e.bossPhase<1&&ratio<=0.7){
    e.bossPhase=1; e.speed*=1.15; e.bossSkillTimer=0.5;
    spawnRing(e.x,e.y,e.radius+20,"#f87171"); SFX.boss();
    for(let i=0;i<3;i++) spawnEnemy(Math.random()<0.5?"fast":"normal",{x:e.x+rand(-60,60),y:e.y+rand(-10,20),hpMult:0.9,speedMult:1.2,expMult:0.35,goldMult:0.35});
  }
  if(e.bossPhase<2&&ratio<=0.4){
    e.bossPhase=2; e.speed*=1.2; e.bossShieldTimer=3; e.bossSkillTimer=0.4;
    spawnRing(e.x,e.y,e.radius+30,"#38bdf8"); SFX.boss();
    for(let i=-2;i<=2;i++) spawnEnemyBullet(e.x,e.y,Math.PI/2+i*0.22,140+wave*2,7+wave*0.35,5,"#f87171");
  }
  if(e.bossPhase<3&&ratio<=0.15){
    e.bossPhase=3; e.speed*=1.25; e.bossSkillTimer=0.2;
    spawnRing(e.x,e.y,e.radius+40,"#facc15"); SFX.boss();
    for(let i=0;i<4;i++) spawnEnemy(Math.random()<0.5?"elite":"fast",{x:e.x+rand(-80,80),y:e.y+rand(-10,30),hpMult:0.8,speedMult:1.2,expMult:0.4,goldMult:0.4});
  }
}
function updateBossSkills(e,dt){
  if(e.bossShieldTimer>0) e.bossShieldTimer-=dt;
  if(e.bossChargeTimer>0) e.bossChargeTimer-=dt;
  e.bossSkillTimer-=dt;
  if(e.bossSkillTimer>0) return;
  const v=e.bossVariant;
  if(v===0){
    const count=3+e.bossPhase;
    for(let i=0;i<count;i++) spawnEnemy(["fast","normal","summoner","healer"][i%4],{x:e.x+rand(-80,80),y:e.y+rand(-10,30),hpMult:0.85,speedMult:1.15,expMult:0.3,goldMult:0.3});
    SFX.boss(); e.bossSkillTimer=Math.max(2.0,6.5-e.bossPhase*1.2);
  } else if(v===1){
    if(_rng()<0.55){ e.bossChargeTimer=1.6; e.bounceFlash=0.3; spawnParticles(e.x,e.y,"#ef4444",20,240); SFX.boss(); }
    else { for(let i=0;i<2+e.bossPhase;i++) spawnEnemy("charger",{x:e.x+rand(-70,70),y:e.y+rand(0,25),hpMult:0.8,speedMult:1.1,expMult:0.3,goldMult:0.3}); SFX.boss(); }
    e.bossSkillTimer=Math.max(1.5,5.5-e.bossPhase*1.1);
  } else {
    const count=4+e.bossPhase*2;
    for(let i=0;i<count;i++){ const spread=(i-(count-1)/2)*0.16; spawnEnemyBullet(e.x,e.y,Math.PI/2+spread,130+wave*2,5.5+wave*0.3,5,"#f87171"); }
    if(_rng()<0.4) spawnEnemy("ranged",{x:e.x+rand(-60,60),y:e.y+10,hpMult:1.1,speedMult:0.9,expMult:0.4,goldMult:0.4});
    if(e.bossPhase>=2&&_rng()<0.4) e.bossShieldTimer=3;
    SFX.boss(); e.bossSkillTimer=Math.max(1.6,6-e.bossPhase*1.2);
  }
}

/* ================= 更新 ================= */
function updateTimers(dt){
  const d=defense;
  if(d.recoil>0) d.recoil=Math.max(0,d.recoil-28*dt);
  if(d.muzzleFlash>0) d.muzzleFlash=Math.max(0,d.muzzleFlash-dt);
  if(d.hurtFlash>0) d.hurtFlash=Math.max(0,d.hurtFlash-dt);
  d.heat=Math.max(0,d.heat-dt*0.55);
  if(screenFlash>0) screenFlash=Math.max(0,screenFlash-dt*2.2);
  if(d.shieldTimer>0) d.shieldTimer-=dt;
  if(d.shieldHp>0&&d.shieldTimer<=0) d.shieldHp=0;
  if(d.frenzyTimer>0) d.frenzyTimer-=dt;
  if(d.hunterTimer>0) d.hunterTimer-=dt;
  if(d.empTimer>0) d.empTimer-=dt;
  if(d.stasisTimer>0){
    d.stasisTimer-=dt;
    if(d.stasisTimer<=0){
      for(const b of enemyBullets){ spawnParticles(b.x,b.y,"#67e8f9",4,140); }
      enemyBullets.length=0;
      spawnRing(d.x,d.y,260,"#67e8f9");
    }
  }

  if(d.areaTimer>0){
    d.areaTimer-=dt;
    const elapsed=5.2-d.areaTimer;
    if(!d.areaOrbitalDone && elapsed>=1.15){
      d.areaOrbitalDone=true;
      d.orbitalTimer=2.1;
      d.orbitalTargetX=d.areaTargetX;
      d.orbitalX=d.orbitalTargetX;
      SFX.orb();
      addDamageText(d.areaTargetX, clamp(d.areaTargetY-30,80,H-120), "範圍技：軌道", "#4ade80");
    }
    if(!d.areaAirstrikeDone && elapsed>=3.45){
      d.areaAirstrikeDone=true;
      d.airstrikeTimer=1.3;
      d.airstrikeSpawn=0.08;
      d.airstrikeTargetX=d.areaTargetX;
      d.airstrikeTargetY=d.areaTargetY;
      SFX.air();
      addDamageText(d.areaTargetX, clamp(d.areaTargetY-30,80,H-120), "範圍技：空襲", "#fb923c");
    }
    if(d.areaTimer<=0){
      d.areaTargetX=NaN;
      d.areaTargetY=NaN;
    }
  }

  if(d.orbitalTimer>0) updateOrbital(dt);
  else if(Number.isFinite(d.orbitalTargetX)) d.orbitalTargetX=NaN;

  if(d.airstrikeTimer>0){
    d.airstrikeTimer-=dt;
    d.airstrikeSpawn-=dt;
    if(d.airstrikeSpawn<=0){
      d.airstrikeSpawn=0.16;
      if(Number.isFinite(d.airstrikeTargetX)){
        airstrikes.push({
          x:clamp(d.airstrikeTargetX+rand(-120,120),30,W-30),
          y:clamp(d.airstrikeTargetY+rand(-100,100),140,H-210),
          life:0.6
        });
      } else {
        airstrikes.push({x:rand(30,W-30),y:rand(140,H-210),life:0.6});
      }
    }
    if(d.airstrikeTimer<=0){
      d.airstrikeTargetX=NaN;
      d.airstrikeTargetY=NaN;
    }
  }

  updateAirstrikes(dt); updateFires(dt);
  for(let i=flashes.length-1;i>=0;i--){ flashes[i].life-=dt; if(flashes[i].life<=0) flashes.splice(i,1); }
  for(const k of SKILL_KEYS) if(d.skillCd[k]>0) d.skillCd[k]=Math.max(0,d.skillCd[k]-dt);
  if(chestCooldown>0) chestCooldown=Math.max(0, chestCooldown-dt);

  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0){ combo=0; } }
  if(comboTimer<=0) superMeter=Math.max(0,superMeter-16*dt);
  if(superMeter>=50&&superFired<1){ superFired=1; addDamageText(d.x,d.y-70,"超能：範圍技","#fde047",true); SFX.super(); castSkill("area",true); }
  if(superMeter>=100&&superFired<2){ superFired=2; addDamageText(d.x,d.y-70,"超能：電磁脈衝","#a78bfa",true); SFX.super(); castSkill("emp",true); }
  if(superMeter<50) superFired=0;

  if(d.regen>0) heal(d.regen*dt,false);
  if(effectiveMods.selfDamagePerSec>0){ d.hp-=effectiveMods.selfDamagePerSec*dt; if(d.hp<=0){ d.hp=0; gameOver(); } }
  if(d.evolutions.chainStorm){
    chainStormTimer-=dt;
    if(chainStormTimer<=0){
      chainStormTimer=4.5;
      const alive=enemies.filter(e=>!e.dead);
      if(alive.length) chainLightning(alive[Math.floor(_rng()*alive.length)].x,alive[Math.floor(_rng()*alive.length)].y,Math.min(5,2+d.chain),d.damage*0.65,[],true);
    }
  }
  if(waveBannerTimer>0) waveBannerTimer-=dt;
  if(bossWarningTimer>0) bossWarningTimer-=dt;
  lightningTimer-=dt;
  if(lightningTimer<=0){ lightningTimer=rand(5,14); lightningFlash=0.5; lightningX=rand(40,W-40); }
  if(lightningFlash>0) lightningFlash-=dt;
  ambientTimer-=dt;
  if(ambientTimer<=0){
    ambientTimer=0.3;
    if(particles.length<particleLimit()-12){
      const warm=_rng()<0.35;

function updateBullets(dt){

function update(dt){

  defense.x=clamp(defense.x,12,W-12);
  updateAim();
  defense.fireCooldown-=dt;
  const hunterMult=defense.hunterTimer>0?0.8:1;
  const efr=defense.fireRate*effectiveMods.playerFireRateMult*(defense.frenzyTimer>0?0.6:1)*hunterMult;
  if(defense.fireCooldown<=0){ fire(); defense.fireCooldown=efr; }
  updateBullets(dt); if(state!=="playing") return;
  updateEnemies(dt); if(state!=="playing") return;
  updateEnemyBullets(dt); if(state!=="playing") return;
  updateOrbs(dt); updateBlackholes(dt); updateMines(dt); updateDrones(dt);
  if(!Number.isFinite(exp)) exp=0;
  if(!Number.isFinite(expNeed)||expNeed<=0) expNeed=20;
  if(!Number.isFinite(gold)) gold=0;
  if(!Number.isFinite(kills)) kills=0;
  checkObjective();
  checkLevelUp(); if(state!=="playing") return;
  waveTimer+=dt;
  if(waveStats) waveStats.fastTimer=waveTimer;
  if(waveTimer>=waveDuration){
    wave++; waveTimer=0; bossSpawnedInWave=false;
    waveBannerText=`WAVE ${wave}`; waveBannerTimer=1.8;
    chestWaveLimit=Math.min(3,1+Math.floor(wave/8));
    chestWaveCount=0;
    chestCooldown=Math.max(chestCooldown,1.2);
    if(wave%5===0) rollMutation();
    rollWaveModifiers(); rollObjective();
    const es=getEarlyScale();
    spawnInterval=Math.max(0.24,(1.55-(wave-1)*0.034-Math.max(0,wave-18)*0.012)*currentDifficulty.spawnMult*es.spawn/effectiveMods.enemyCountMult*(mode==="endless"?0.85:1));
    spawnTimer=0;
    if(defense.waveHeal>0) heal(defense.maxHp*defense.waveHeal,true);
    barricade.hp=Math.min(barricade.maxHp,barricade.hp+barricade.maxHp*0.08);
    SFX.waveEnd();
    if(wave%10===0) spawnChestEnemy(W/2,-40);
    if(wave%4===0){ for(let i=0;i<3;i++) spawnEnemy(_rng()<0.5?"charger":"ranged",{x:rand(40,W-40),y:-20-i*25,elite:wave>=12&&_rng()<0.4}); }
    if(wave%3===0){ if(pendingLevels>0){ openLevelUp("shop"); return; } openShop(); return; }
  }
  if(wave%5===0&&!bossSpawnedInWave&&waveTimer>waveDuration*0.65){ spawnBoss(); bossSpawnedInWave=true; SFX.boss(); }
  spawnTimer-=dt;
  if(spawnTimer<=0){
    const es=getEarlyScale();
    const maxEnemies=Math.min(CONFIG.maxEnemies,(22+wave*3+(wave>15?(wave-15)*2.5:0))*es.max);
    const count=Math.floor((1+Math.floor(wave/5)+(wave>=18?1:0)+(wave>=25?1:0))*effectiveMods.enemyCountMult);
    for(let i=0;i<count;i++){ if(enemies.length>=maxEnemies) break; spawnEnemy(chooseEnemyType()); }
    spawnTimer=spawnInterval;
  }
}

    ctx.strokeStyle="#b45309"; ctx.lineWidth=1; ctx.stroke();

    if(e.bossPhase>=2){ ctx.strokeStyle="rgba(56,189,248,0.5)"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(e.x,e.y+bob,e.radius+14,0,Math.PI*2); ctx.stroke(); }
    if(e.bossPhase>=3){ ctx.strokeStyle="rgba(250,204,21,0.6)"; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(e.x,e.y+bob,e.radius+20,0,Math.PI*2); ctx.stroke(); }
    if(e.bossChargeTimer>0){ ctx.strokeStyle="rgba(239,68,68,0.9)"; ctx.lineWidth=3; ctx.setLineDash([8,5]); ctx.beginPath(); ctx.arc(e.x,e.y+bob,e.radius+10,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]); }

function drawHpBar(e,bob,c1,c2){

function drawBullet(b){
  let color="#7dd3fc";
  if(b.sniper) color="#e2e8f0";
  else if(b.isCrit) color="#fbbf24";
  else if(b.chain>0) color="#a78bfa";
  else if(b.aoe>0) color="#fb923c";
  else if(b.freeze>0) color="#38bdf8";
  else if(b.homing>0) color="#c084fc";
  else if(b.split>0) color="#4ade80";
  if(quality>0.5&&bullets.length<80) drawGlowCircle(b.x,b.y,b.r*(b.sniper?9:7),color,0.18);

    ctx.save(); ctx.globalCompositeOperation="lighter";

  }

function drawOrb(o){

function drawThreatArrows(){
  if(quality<=0.4) return;
  let shown=0;
  for(const e of enemies){
    if(shown>=10) break;
    if(e.dead||e.y>150||e.y<-40) continue;
    shown++;
    const x=clamp(e.x,20,W-20), pulse=0.7+0.3*Math.sin(gameTime*6+x);

function updateQuality(dt){
  if(settings.quality!=="auto") return;
  if(dt>0){
    fpsSamples.push(1/dt); if(fpsSamples.length>90) fpsSamples.shift();
    const avg=fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length;
    if(avg<32) quality=0.35; else if(avg<45) quality=0.6; else if(avg>55) quality=1;
  }
}
function frame(ts){
  try{
    if(!lastTime) lastTime=ts;
    const dt=Math.min(0.1,(ts-lastTime)/1000);
    lastTime=ts;
    updateQuality(dt);
    updateDuck();
    let step=dt;
    if(hitStop>0){ hitStop=Math.max(0,hitStop-dt); step=dt*0.14; }
    if(state==="playing"){
      accumulator+=step;
      while(accumulator>=FIXED_STEP&&state==="playing"){ update(FIXED_STEP); accumulator-=FIXED_STEP; }
      if(state!=="playing") accumulator=0;
    } else accumulator=0;
    render();
    updateSkillButtons();
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}

const aimOffsetY=isCoarse?-46:0;
function isJoyZone(p){ return isCoarse?(p.y>H-260&&p.x<W*0.42):(p.y>H-150); }
canvas.addEventListener("pointerdown",e=>{
  if(state!=="playing") return;
  e.preventDefault();
  const p=getCanvasCoords(e); if(!p) return;
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  if(e.pointerType==="mouse"||e.pointerType==="pen"){
    mouseDown=true;
    pointerX=p.x; pointerY=p.y+aimOffsetY; hasPointerAim=true;
    if(p.y>H-150){ pointerRoles.set(e.pointerId,{role:"move"}); setPointerTarget(p); }
    else pointerRoles.set(e.pointerId,{role:"aim"});
  } else {
    if(isJoyZone(p)){ pointerRoles.set(e.pointerId,{role:"joy"}); joyActive=true; joyOriginX=p.x; joyX=p.x; }
    else { pointerRoles.set(e.pointerId,{role:"aim"}); pointerX=p.x; pointerY=p.y+aimOffsetY; hasPointerAim=true; }
  }
});
canvas.addEventListener("pointermove",e=>{
  if(state!=="playing") return;
  const p=getCanvasCoords(e); if(!p) return;
  const role=pointerRoles.get(e.pointerId);
  if(role&&role.role==="joy"){ joyX=p.x; return; }
  if(e.pointerType==="mouse"||e.pointerType==="pen"){
    pointerX=p.x; pointerY=p.y+aimOffsetY; hasPointerAim=true;
    if(role&&role.role==="move") setPointerTarget(p);
    else if(mouseDown&&p.y>H-150) setPointerTarget(p);
  } else if(role&&role.role==="aim"){ pointerX=p.x; pointerY=p.y+aimOffsetY; hasPointerAim=true; }
});
function endPointer(e){
  const role=pointerRoles.get(e.pointerId);
  if(role&&role.role==="joy") joyActive=false;
  if(e.pointerType==="mouse"||e.pointerType==="pen") mouseDown=false;
  pointerRoles.delete(e.pointerId);
}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);
canvas.addEventListener("pointerleave",e=>{ if((e.pointerType==="mouse"||e.pointerType==="pen")&&!mouseDown) hasPointerAim=false; });

modeBtns.endless.addEventListener("click",()=>{ mode="endless"; renderModeButtons(); });
function renderChassis(){
  chassisGridEl.innerHTML="";
  for(const c of chassisDefs){
    const unlocked=!!meta.unlocked[c.id];
    const b=document.createElement("button");
    b.className="mini-btn chassis-btn"+(meta.chassis===c.id?" sel":"");
    b.disabled=!unlocked;
    b.textContent=unlocked?c.name:`🔒 ${c.name}\n${c.cost} 金`;
    b.title=c.blurb;
    b.addEventListener("click",()=>{
      if(!unlocked){
        if(meta.goldBank<c.cost) return;
        meta.goldBank-=c.cost; meta.unlocked[c.id]=true;
      }
      meta.chassis=c.id; saveAll(); renderChassis(); renderMeta();
    });
    chassisGridEl.appendChild(b);
  }
}
function renderMeta(){
  metaGoldEl.textContent=`永久金幣庫：${Math.floor(meta.goldBank)}（結算加成 x${(1+(meta.goldBonus||0)*0.2).toFixed(2)}）`;
  highStatsEl.textContent=`最高：波 ${high.wave}｜殺 ${high.kills}｜Lv ${high.level}｜每日 ${high.dailyWave}｜無盡 ${high.endlessWave}`;
  metaUpgradesEl.innerHTML="";
  for(const up of metaUpgrades){
    const cost=up.base*((meta[up.id]||0)+1);
    const btn=document.createElement("button");
    btn.className="mini-btn meta-btn";
    btn.textContent=`${up.title}\n${cost} 金｜Lv ${meta[up.id]||0}`;
    btn.disabled=meta.goldBank<cost;
    btn.addEventListener("click",()=>{ if(meta.goldBank<cost) return; meta.goldBank-=cost; meta[up.id]=(meta[up.id]||0)+1; saveAll(); renderMeta(); });
    metaUpgradesEl.appendChild(btn);
  }
  renderChassis(); renderModeButtons();
}

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    if(state==="playing") pauseGame();
    if(state==="levelup") stopLevelupCountdown();
    if(state==="shop") stopShopCountdown();
    stopMusic();
  } else {
    if(state==="levelup"&&overlay.classList.contains("active")) startLevelupCountdown(false);
    if(state==="shop"&&overlay.classList.contains("active")) startShopCountdown(false);
    updateMusicPlayback();
  }
});
window.addEventListener("resize",setupCanvas);
window.addEventListener("pagehide",settleRun);
window.addEventListener("beforeunload",settleRun);

loadSettings(); loadStats();
applySettings(); buildSkillButtons(); updateSoundButtons(); updateVolumeInputs(); renderMeta();
resetGame(); state="start";
startScreen.classList.add("active"); updateSkillButtons();
requestAnimationFrame(frame);
})();
