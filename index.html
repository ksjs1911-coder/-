<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>向殭屍開炮 v8.0</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:calc(env(safe-area-inset-top) + 4px) calc(env(safe-area-inset-right) + 4px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 4px);
  background:radial-gradient(circle at 50% 22%,#131c33 0%,#050a16 52%,#000 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
  color:#f8fafc;
}
#game-wrap{
  position:relative;
  aspect-ratio:450/800;
  width:min(450px,94vw,max(240px,calc((100vh - 165px) * 450 / 800)));
  width:min(450px,94vw,max(240px,calc((100dvh - 165px) * 450 / 800)));
  max-height:min(800px,calc(100vh - 165px));
  max-height:min(800px,calc(100dvh - 165px));
  height:auto;
  overflow:hidden;
  border-radius:20px;
  box-shadow:0 0 0 1px rgba(56,189,248,.10),0 18px 60px rgba(0,0,0,.65),0 0 70px rgba(56,189,248,.10),inset 0 0 90px rgba(0,0,0,.45);
}
@supports not (aspect-ratio: 450/800){
  #game-wrap{height:min(800px,calc(100vh - 165px),calc(94vw * 800 / 450))}
}
@keyframes shake{
  0%{transform:translate(0,0)}
  20%{transform:translate(-5px,4px)}
  40%{transform:translate(5px,-4px)}
  60%{transform:translate(-4px,-5px)}
  80%{transform:translate(4px,5px)}
  100%{transform:translate(0,0)}
}
.shake{animation:shake .32s cubic-bezier(.36,.07,.19,.97) both}
canvas{
  display:block;
  width:100%;
  height:100%;
  background:#020617;
  touch-action:none;
  cursor:crosshair;
}
#hud-buttons{
  position:absolute;
  top:10px;
  right:10px;
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  align-items:center;
  justify-content:flex-end;
  z-index:30;
  max-width:62%;
}
#hud-buttons.open{max-width:92%}
#hud-buttons > *:not(#pause-btn):not(#hud-menu-btn){display:none}
#hud-buttons.open > *{display:inline-block}
.mini-btn{
  background:rgba(8,15,30,.82);
  color:#e2e8f0;
  border:1px solid rgba(51,65,85,.9);
  border-radius:9px;
  padding:6px 8px;
  font-size:13px;
  line-height:1;
  cursor:pointer;
  transition:.15s;
  backdrop-filter:blur(6px);
}
.mini-btn:hover{border-color:#38bdf8;background:rgba(30,41,59,.9);box-shadow:0 0 14px rgba(56,189,248,.25)}
.mini-btn.on{border-color:#38bdf8;color:#7dd3fc}
.mini-range{
  width:52px;
  accent-color:#38bdf8;
  background:rgba(8,15,30,.82);
  border:1px solid rgba(51,65,85,.9);
  border-radius:9px;
  height:28px;
  padding:0 3px;
}
#skills{
  display:none;
  align-items:center;
  justify-content:center;
  gap:5px;
  width:min(450px,94vw,max(240px,calc((100vh - 165px) * 450 / 800)));
  width:min(450px,94vw,max(240px,calc((100dvh - 165px) * 450 / 800)));
  height:64px;
  padding:6px 8px;
  background:linear-gradient(180deg,rgba(2,6,23,.22),rgba(2,6,23,.92));
  border:1px solid rgba(51,65,85,.55);
  border-radius:16px;
  backdrop-filter:blur(8px);
  z-index:5;
  overflow:hidden;
}
body.one-hand #skills{justify-content:flex-end;padding-right:14px}
.skill-btn{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(180deg,rgba(15,23,42,.9),rgba(4,9,20,.92));
  border:1px solid var(--scb,#1e293b);
  color:var(--sc,#38bdf8);
  font-size:14px;
  font-weight:800;
  line-height:1;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(6px);
  transition:transform .12s,box-shadow .12s;
  box-shadow:inset 0 0 12px rgba(0,0,0,.4);
  flex:0 0 auto;
}
.skill-btn:hover{transform:translateY(-2px)}
.skill-btn:active{transform:translateY(0) scale(.96)}
.skill-btn:disabled{opacity:.5;cursor:not-allowed}
.skill-btn .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.skill-btn .hk{position:absolute;top:3px;left:4px;font-size:8px;font-weight:700;color:#94a3b8}
.skill-btn .cd-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(2,6,23,.72)}
.skill-btn .cd-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#facc15;text-shadow:0 1px 3px #000;pointer-events:none}
.skill-btn.cooling{color:#64748b}
@media (max-width:420px){
  .skill-btn{width:36px;height:36px;font-size:12px;border-radius:10px}
  .skill-btn .hk{font-size:7px}
  .skill-btn .cd-num{font-size:11px}
}
.overlay{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  text-align:center;
  background:rgba(2,6,23,.9);
  color:#f8fafc;
  padding:20px;
  border-radius:20px;
  z-index:20;
  overflow:auto;
  backdrop-filter:blur(8px);
}
.overlay.active{display:flex}
.overlay::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:20px;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px);
  opacity:.2;
}
@keyframes neonPulse{
  from{text-shadow:0 0 12px rgba(56,189,248,.3),0 0 26px rgba(56,189,248,.2)}
  to{text-shadow:0 0 20px rgba(56,189,248,.6),0 0 46px rgba(168,85,247,.28),0 0 80px rgba(168,85,247,.28)}
}
.overlay h1{margin:0 0 6px;font-size:28px;color:#38bdf8;animation:neonPulse 2.2s ease-in-out infinite alternate;letter-spacing:2px}
.overlay p{margin:0 0 10px;color:#cbd5e1;font-size:13.5px;line-height:1.5;white-space:pre-line}
#levelup-timer{margin:0 0 12px;font-size:13px;color:#facc15;font-weight:700;white-space:pre-line}
.btn-group{display:flex;flex-direction:column;gap:9px;width:100%;max-width:250px}
.btn{
  background:rgba(15,23,42,.92);
  color:#f8fafc;
  border:1px solid #38bdf8;
  border-radius:12px;
  padding:12px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:.15s;
}
.btn:hover{background:#38bdf8;color:#020617;transform:translateY(-2px)}
.btn.easy{border-color:#4ade80;color:#4ade80}.btn.easy:hover{background:#4ade80;color:#020617}
.btn.hard{border-color:#f87171;color:#f87171}.btn.hard:hover{background:#f87171;color:#020617}
.row{display:flex;gap:8px;width:100%;max-width:340px;justify-content:center;flex-wrap:wrap}
#cards{width:100%;max-width:360px;display:flex;flex-direction:column;gap:9px;max-height:54vh;overflow:auto}
.card{
  width:100%;
  text-align:left;
  background:linear-gradient(180deg,rgba(20,30,52,.94),rgba(9,15,28,.94));
  border:1px solid #2a3a55;
  color:#f8fafc;
  border-radius:12px;
  padding:12px 14px;
  cursor:pointer;
  transition:.15s;
}
.card:hover{background:#1c2a44;border-color:#38bdf8;transform:translateY(-2px)}
.card.disabled{opacity:.42;cursor:not-allowed}
.stat-card{cursor:default}
.stat-card:hover{background:linear-gradient(180deg,rgba(20,30,52,.94),rgba(9,15,28,.94));border-color:#2a3a55;transform:none}
.card strong{display:block;margin-bottom:3px;color:#38bdf8;font-size:15px}
.card span{color:#cbd5e1;font-size:12.5px;line-height:1.45;white-space:pre-line}
#restart-btn{
  display:none;
  margin-top:12px;
  background:#38bdf8;
  color:#020617;
  border:none;
  border-radius:12px;
  padding:11px 22px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.tip{margin-top:10px;color:#94a3b8;font-size:11.5px;line-height:1.6;text-align:left}
.meta-line{width:100%;max-width:360px;color:#cbd5e1;font-size:12.5px;margin:2px 0}
.meta-grid{width:100%;max-width:360px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:9px 0 12px}
.meta-btn{padding:7px 6px;font-size:11px;line-height:1.35;white-space:pre-line;text-align:center}
.meta-btn:disabled{opacity:.45;cursor:not-allowed}
.chassis-grid{width:100%;max-width:360px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.chassis-btn{padding:8px 4px;font-size:11px;line-height:1.3;white-space:pre-line;text-align:center;border-radius:10px}
.chassis-btn.sel{border-color:#38bdf8;background:rgba(56,189,248,.16);color:#7dd3fc}
.chassis-btn:disabled{opacity:.4;cursor:not-allowed}
.sect{width:100%;max-width:360px;text-align:left;color:#64748b;font-size:11px;letter-spacing:1.5px;margin:8px 0 4px;text-transform:uppercase}
:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#crash{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  background:rgba(2,6,23,.96);
  z-index:40;
  border-radius:20px;
  padding:24px;
  text-align:center;
}
#crash.active{display:flex}
@media (prefers-reduced-motion:reduce){
  .shake{animation:none}
  .btn:hover,.card:hover,.skill-btn:hover{transform:none}
  .overlay h1{animation:none}
}
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" role="application" aria-label="向殭屍開炮 遊戲畫布"></canvas>
  <div id="sr" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="hud-buttons">
    <button id="hud-menu-btn" class="mini-btn" title="選單">⋯</button>
    <button id="pause-btn" class="mini-btn" title="暫停">⏸</button>
    <button id="toggle-sound" class="mini-btn" title="音效">🔊</button>
    <input id="sound-vol" class="mini-range" type="range" min="0" max="1" step="0.05" aria-label="音效音量" />
    <button id="toggle-music" class="mini-btn" title="音樂">🎵</button>
    <input id="music-vol" class="mini-range" type="range" min="0" max="1" step="0.05" aria-label="音樂音量" />
    <button id="stats-btn" class="mini-btn" title="素質">📊</button>
    <button id="codex-btn" class="mini-btn" title="圖鑑">📖</button>
    <button id="settings-btn" class="mini-btn" title="設定">⚙</button>
  </div>

  <div id="start-screen" class="overlay active">
    <h1>向殭屍開炮</h1>
    <p>v8.0｜iPhone 友善｜技能列不遮擋｜技能強化｜自動技能｜高特效</p>
    <div id="meta-gold" class="meta-line"></div>
    <div id="high-stats" class="meta-line"></div>
    <div class="sect">底盤</div>
    <div class="chassis-grid" id="chassis-grid"></div>
    <div class="sect">永久升級</div>
    <div id="meta-upgrades" class="meta-grid"></div>
    <div class="sect">模式</div>
    <div class="row">
      <button class="mini-btn" id="mode-std">一般</button>
      <button class="mini-btn" id="mode-daily">每日種子</button>
      <button class="mini-btn" id="mode-endless">無盡</button>
    </div>
    <div class="sect">難度</div>
    <div class="btn-group">
      <button class="btn easy" data-diff="easy">簡單 (Easy)</button>
      <button class="btn normal" data-diff="normal">普通 (Normal)</button>
      <button class="btn hard" data-diff="hard">困難 (Hard)</button>
    </div>
    <div class="tip">
      操作：滑鼠瞄準｜←→/AD 移動｜按住底部拖曳移動｜手機左下拖曳移動、其餘拖曳瞄準<br />
      技能列在畫面下方，不會遮擋戰場；右上角 ⋯ 可展開音效、素質、圖鑑、設定<br />
      技能 Q 域 E 盾 R 狂 F 雷 G 狙 H 靜 J 磁 K 機（可在 ⚙ 設定改鍵）<br />
      連擊超能槽：50 自動範圍技、100 自動 EMP｜每 3 波商店｜每 5 波 BOSS 與異變<br />
      升級圖示可在 HUD 左側點擊領取｜寶箱同屏限量，避免 LAG
    </div>
  </div>

  <div id="overlay" class="overlay">
    <h1 id="overlay-title">升級選擇</h1>
    <p id="overlay-desc">選擇一個強化</p>
    <div id="levelup-timer"></div>
    <div id="cards"></div>
    <button id="restart-btn">返回主選單</button>
  </div>

  <div id="crash">
    <h1 style="color:#f87171">發生錯誤</h1>
    <p id="crash-msg" style="color:#cbd5e1;font-size:12.5px;white-space:pre-line;max-width:320px"></p>
    <button class="btn" id="crash-reload">重新載入</button>
  </div>
</div>

<div id="skills"></div>

<script>
(function(){
"use strict";

/* ---------- DOM ---------- */
var gameWrap = document.getElementById("game-wrap");
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var W = 450, H = 800, FIXED_STEP = 1/60, HITBOX_SHRINK = 6;

var startScreen = document.getElementById("start-screen");
var overlay = document.getElementById("overlay");
var overlayTitle = document.getElementById("overlay-title");
var overlayDesc = document.getElementById("overlay-desc");
var levelupTimerEl = document.getElementById("levelup-timer");
var cardsEl = document.getElementById("cards");
var restartBtn = document.getElementById("restart-btn");
var diffButtons = document.querySelectorAll(".btn[data-diff]");
var toggleSoundBtn = document.getElementById("toggle-sound");
var toggleMusicBtn = document.getElementById("toggle-music");
var pauseBtn = document.getElementById("pause-btn");
var statsBtn = document.getElementById("stats-btn");
var codexBtn = document.getElementById("codex-btn");
var settingsBtn = document.getElementById("settings-btn");
var soundVolEl = document.getElementById("sound-vol");
var musicVolEl = document.getElementById("music-vol");
var skillsEl = document.getElementById("skills");
var metaGoldEl = document.getElementById("meta-gold");
var highStatsEl = document.getElementById("high-stats");
var metaUpgradesEl = document.getElementById("meta-upgrades");
var chassisGridEl = document.getElementById("chassis-grid");
var srEl = document.getElementById("sr");
var crashEl = document.getElementById("crash");
var crashMsg = document.getElementById("crash-msg");
var hudButtonsEl = document.getElementById("hud-buttons");
var hudMenuBtn = document.getElementById("hud-menu-btn");

var modeBtns = {
  std: document.getElementById("mode-std"),
  daily: document.getElementById("mode-daily"),
  endless: document.getElementById("mode-endless")
};

var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var isCoarse = window.matchMedia("(pointer: coarse)").matches;

var SETTINGS_KEY = "za-v8-settings";
var STATS_KEY = "za-v8-stats";
var SAVE_V = 1;

var crashShown = false;

function announce(msg){ if(srEl){ srEl.textContent = msg; } }

function showCrash(err){
  if(crashShown){ return; }
  crashShown = true;
  try{
    var txt = err && err.stack ? err.stack : (err && err.message ? err.message : String(err));
    if(crashMsg){ crashMsg.textContent = String(txt).slice(0,400); }
    if(crashEl){ crashEl.classList.add("active"); }
  }catch(_){}
  try{ stopMusic(); stopLevelupCountdown(); stopShopCountdown(); }catch(_){}
}
window.addEventListener("error", function(ev){ try{ showCrash(ev.error || ev.message); }catch(_){} });
window.addEventListener("unhandledrejection", function(ev){ try{ showCrash(ev.reason); }catch(_){} });

/* ---------- RNG ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var _rng = mulberry32(1);
var runSeed = 1;
function rnd(){ return _rng(); }
function setSeed(s){ runSeed = (s >>> 0) || 1; _rng = mulberry32(runSeed); }
function dailySeed(){
  var d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}

/* ---------- 技能 ---------- */
var SKILL_DEFS = [
  {key:"area",   label:"域", color:"#fde047", cd:38, name:"範圍技",   desc:"自動連段：黑洞吸引 → 軌道雷射 → 空襲爆燃"},
  {key:"shield", label:"盾", color:"#38bdf8", cd:27, name:"護盾",     desc:"高容量護盾，存在時減傷 38%"},
  {key:"frenzy", label:"狂", color:"#f59e0b", cd:22, name:"狂暴",     desc:"4 秒攻速提升且子彈必暴擊"},
  {key:"mines",  label:"雷", color:"#f87171", cd:24, name:"地雷場",   desc:"在防線前方放置地雷，觸發爆炸與減速"},
  {key:"sniper", label:"狙", color:"#e2e8f0", cd:18, name:"狙擊",     desc:"發射一發高傷穿透狙擊彈，暴擊並減速"},
  {key:"stasis", label:"靜", color:"#22d3ee", cd:34, name:"時間靜止", desc:"敵人凍結且受傷 +45%，結束時碎彈"},
  {key:"emp",    label:"磁", color:"#a78bfa", cd:30, name:"電磁脈衝", desc:"清除敵彈、全場減速、重創遠程與召喚"},
  {key:"drone",  label:"機", color:"#4ade80", cd:32, name:"無人機",   desc:"召喚無人機自動掃射 8 秒"}
];
var SKILL_KEYS = SKILL_DEFS.map(function(s){ return s.key; });
var DEFAULT_KEYMAP = {area:"Q",shield:"E",frenzy:"R",mines:"F",sniper:"G",stasis:"H",emp:"J",drone:"K"};

function normalizeKeymap(){
  var def = DEFAULT_KEYMAP;
  var old = settings.keymap || {};
  var map = {
    area: old.area || def.area,
    shield: old.shield || def.shield,
    frenzy: old.frenzy || def.frenzy,
    mines: old.mines || def.mines,
    sniper: old.sniper || def.sniper,
    stasis: old.stasis || def.stasis,
    emp: old.emp || def.emp,
    drone: old.drone || def.drone
  };
  var used = {};
  var result = {};
  for(var i=0;i<SKILL_KEYS.length;i++){
    var k = SKILL_KEYS[i];
    var v = String(map[k] || def[k] || "").toUpperCase();
    if(!v || used[v]){
      var candidates = [def[k],"Q","E","R","F","G","H","J","K","Z","X","C","V","B","N","M"];
      v = "";
      for(var c=0;c<candidates.length;c++){
        var cand = String(candidates[c]).toUpperCase();
        if(cand && !used[cand]){ v = cand; break; }
      }
    }
    if(v){ used[v] = true; }
    result[k] = v;
  }
  settings.keymap = result;
}

/* ---------- 設定 ---------- */
var settings = {
  soundEnabled:true,
  musicEnabled:true,
  soundVol:0.55,
  musicVol:0.95,
  colorblind:false,
  autoAim:isCoarse,
  oneHand:false,
  hudScale:1,
  shakeOn:true,
  vibrateOn:true,
  reduceFlash:prefersReducedMotion,
  quality:"auto",
  highFx:true,
  autoSkills:isCoarse,
  hudMode:"full",
  keymap:{area:"Q",shield:"E",frenzy:"R",mines:"F",sniper:"G",stasis:"H",emp:"J",drone:"K"}
};

var CONFIG = {
  maxEnemies:90,
  maxBullets:260,
  maxParticles:220,
  maxOrbs:50,
  maxEnemyBullets:80,
  maxDecals:70,
  levelupLimit:20,
  shopLimit:60,
  caps:{
    multishot:7,
    fireRateMin:0.09,
    bulletSpeedMax:900,
    freeze:4,
    pierce:8,
    aoe:150,
    explosionHeal:3,
    bounce:50,
    regen:6,
    lifesteal:15,
    healDropChance:0.55,
    waveHeal:0.18,
    armor:0.45,
    chain:4,
    homing:1.2,
    split:2,
    crit:0.45,
    pickup:65,
    skillHaste:8,
    skillPower:8,
    shieldCapacity:6,
    shieldDuration:5,
    mineCount:4,
    minePower:6,
    droneCount:4,
    droneFire:5,
    sniperPower:6,
    stasisDuration:5,
    empPower:6,
    areaPower:6
  }
};

/* ---------- 狀態 ---------- */
var state = "start", lastTime = 0, accumulator = 0, gameTime = 0;
var wave = 1, kills = 0, gold = 0, level = 1, exp = 0, expNeed = 22;

function roundRect(c,x,y,w,h,r){
  var rr = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+rr,y);
  c.lineTo(x+w-rr,y); c.quadraticCurveTo(x+w,y,x+w,y+rr);
  c.lineTo(x+w,y+h-rr); c.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
  c.lineTo(x+rr,y+h); c.quadraticCurveTo(x,y+h,x,y+h-rr);
  c.lineTo(x,y+rr); c.quadraticCurveTo(x,y,x+rr,y);
  c.closePath();
}

function weightedChoices(pool,count){
  var items = [], i, result = [];
  for(i=0;i<pool.length;i++){ items.push({id:pool[i].id,title:pool[i].title,desc:pool[i].desc,weight:pool[i].weight||1,rarity:pool[i].rarity,apply:pool[i].apply,isMax:pool[i].isMax}); }
  while(result.length < count && items.length){
    var total = 0;
    for(i=0;i<items.length;i++){ total += items[i].weight; }
    var r = rnd()*total, ci = 0;
    for(i=0;i<items.length;i++){ r -= items[i].weight; if(r <= 0){ ci = i; break; } }
    result.push(items[ci]);
    items.splice(ci,1);
  }
  return result;
}
function weightedOne(list){
  var total = 0, i;
  for(i=0;i<list.length;i++){ total += list[i].weight; }
  var r = rnd()*total;
  for(i=0;i<list.length;i++){ r -= list[i].weight; if(r <= 0){ return list[i].type; } }
  return list[0].type;
}

function ensureAudio(){
  if(audioCtx){
    if(audioCtx.state === "suspended"){ audioCtx.resume(); }
    updateGains();
    return;
  }
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC){ return; }
  audioCtx = new AC();
  compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -12; compressor.knee.value = 16; compressor.ratio.value = 10;
  compressor.attack.value = 0.003; compressor.release.value = 0.25;
  compressor.connect(audioCtx.destination);
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.9; masterGain.connect(compressor);
  sfxGain = audioCtx.createGain(); sfxGain.connect(masterGain);
  musicFilter = audioCtx.createBiquadFilter();
  musicFilter.type = "lowpass"; musicFilter.frequency.value = 20000; musicFilter.Q.value = 0.7;
  musicFilter.connect(masterGain);
  musicGain = audioCtx.createGain(); musicGain.connect(musicFilter);
  updateGains();
  if(audioCtx.state === "suspended"){ audioCtx.resume(); }
}
function updateGains(){
  if(!audioCtx){ return; }
  sfxGain.gain.value = settings.soundEnabled ? settings.soundVol : 0;
  musicGain.gain.value = settings.musicEnabled ? settings.musicVol : 0;
}
function updateDuck(){
  if(!audioCtx || !musicFilter){ return; }
  var low = defense && defense.hp/defense.maxHp < 0.35;
  try{ musicFilter.frequency.setTargetAtTime(low ? 750 : 20000, audioCtx.currentTime, 0.4); }catch(_){}
}
function getNoiseBuffer(){
  if(!noiseBuffer){
    var len = Math.floor(audioCtx.sampleRate*0.5);
    noiseBuffer = audioCtx.createBuffer(1,len,audioCtx.sampleRate);
    var d = noiseBuffer.getChannelData(0);
    for(var i=0;i<len;i++){ d[i] = Math.random()*2-1; }
  }
  return noiseBuffer;
}
function playTone(freq,type,dur,vol,freqEnd,dest,delay,absTime){
  if(!audioCtx){ return; }
  var d = dest || sfxGain;
  if(d === sfxGain && !settings.soundEnabled){ return; }
  if(d === musicGain && !settings.musicEnabled){ return; }
  freqEnd = (freqEnd === undefined) ? freq : freqEnd;
  delay = delay || 0;
  var t = (absTime !== null && absTime !== undefined) ? absTime : audioCtx.currentTime + delay;
  var osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(1,freq),t);
  if(freqEnd !== freq){ osc.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd), t+dur); }
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol, t+Math.min(0.01,dur*0.2));
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  osc.connect(g); g.connect(d);
  osc.start(t); osc.stop(t+dur+0.02);
}
function playNoise(dur,vol,dest,delay){
  if(!audioCtx){ return; }
  var d = dest || sfxGain;
  if(d === sfxGain && !settings.soundEnabled){ return; }
  if(d === musicGain && !settings.musicEnabled){ return; }
  var t = audioCtx.currentTime + (delay || 0);
  var src = audioCtx.createBufferSource(); src.buffer = getNoiseBuffer();
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(g); g.connect(d);
  src.start(t); src.stop(t+dur);
}
function gate(key,minGap){

}

function musicScheduler(){
  if(!audioCtx || !settings.musicEnabled || ["playing","levelup","shop"].indexOf(state) < 0){
    musicTimer = null; return;
  }
  while(nextNoteTime < audioCtx.currentTime + 0.15){
    var s = musicStep % 16, dl = nextNoteTime - audioCtx.currentTime, bass = bassPattern[s];
    if(bass > 0){ playTone(bass,"square",0.22,0.10,bass,musicGain,dl); }
    if(s % 2 === 0){ playTone(arpNotes[s],"triangle",0.1,0.06,arpNotes[s],musicGain,dl); playNoise(0.025,0.015,musicGain,dl); }
    if(s % 4 === 0){ playTone(120,"sine",0.15,0.13,40,musicGain,dl); }
    if(s % 8 === 4){ playNoise(0.08,0.07,musicGain,dl); }
    if(wave >= 8 && s % 4 === 2){ var f = arpNotes[(s+4)%16]*2; playTone(f,"triangle",0.08,0.032,f,musicGain,dl); }
    if(wave >= 12 && s % 4 === 0){ playTone(55,"sawtooth",0.2,0.065,35,musicGain,dl); }
    if(defense && defense.hp/defense.maxHp < 0.35 && s % 4 === 0){ playTone(46,"sine",0.22,0.16,30,musicGain,dl); }
    nextNoteTime += 0.125; musicStep++;
  }
  musicTimer = setTimeout(musicScheduler,25);
}
function startMusic(){
  if(!audioCtx || !settings.musicEnabled || musicTimer){ return; }
  musicStep = 0; nextNoteTime = audioCtx.currentTime + 0.05;
  musicScheduler();
}
function stopMusic(){ if(musicTimer){ clearTimeout(musicTimer); musicTimer = null; } }
function updateMusicPlayback(){
  if(!audioCtx){ return; }
  if(settings.musicEnabled && ["playing","levelup","shop"].indexOf(state) >= 0){ startMusic(); }
  else{ stopMusic(); }
}

function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify({v:SAVE_V,settings:settings,meta:meta,mode:mode})); }catch(_){} }

function sanitizeMeta(m){
  var out = {goldBank:0,hp:0,dmg:0,rate:0,speed:0,pickup:0,startGold:0,goldBonus:0,chassis:0,unlocked:[true,false,false],seen:{}};
  if(m && typeof m === "object"){
    var ks = ["goldBank","hp","dmg","rate","speed","pickup","startGold","goldBonus"];
    for(var i=0;i<ks.length;i++){ out[ks[i]] = Math.max(0, Math.floor(sn(m[ks[i]],0))); }
    out.chassis = clamp(Math.floor(sn(m.chassis,0)),0,2);
    if(Array.isArray(m.unlocked)){ for(var j=0;j<3;j++){ out.unlocked[j] = !!m.unlocked[j]; } }
    out.unlocked[0] = true;
    if(m.seen && typeof m.seen === "object"){ out.seen = m.seen; }
  }
  return out;
}
function normalizeSettings(){
  if(["full","compact","minimal"].indexOf(settings.hudMode) < 0){ settings.hudMode = "full"; }
  settings.autoSkills = !!settings.autoSkills;
  settings.highFx = !!settings.highFx;
  settings.reduceFlash = !!settings.reduceFlash;
  settings.colorblind = !!settings.colorblind;
  settings.autoAim = !!settings.autoAim;
  settings.oneHand = !!settings.oneHand;
  settings.shakeOn = !!settings.shakeOn;
  settings.vibrateOn = !!settings.vibrateOn;
  normalizeKeymap();
}
function loadSettings(){
  var raw = null;
  try{ raw = localStorage.getItem(SETTINGS_KEY); }catch(_){ return; }
  if(!raw){ return; }
  var d = null;
  try{ d = JSON.parse(raw); }catch(_){ return; }
  if(!d || typeof d !== "object"){ return; }
  if(d.settings && typeof d.settings === "object"){
    for(var k in settings){
      if(Object.prototype.hasOwnProperty.call(d.settings,k) && typeof d.settings[k] === typeof settings[k]){
        settings[k] = d.settings[k];
      }
    }
  }
  meta = sanitizeMeta(d.meta);
  if(d.mode === "std" || d.mode === "daily" || d.mode === "endless"){ mode = d.mode; }
  if(!settings.keymap){ settings.keymap = {}; }
  normalizeKeymap();
}
function loadStats(){
  var raw = null;
  try{ raw = localStorage.getItem(STATS_KEY); }catch(_){ return; }
  if(!raw){ return; }
  var d = null;
  try{ d = JSON.parse(raw); }catch(_){ return; }
  if(d && typeof d === "object"){
    for(var k in high){ if(Object.prototype.hasOwnProperty.call(d,k)){ high[k] = Math.max(0, Math.floor(sn(d[k], high[k]))); } }
  }
}
function settleRun(){
  if(!defense || runSettled || state === "start"){ return 0; }
  runSettled = true;
  var bonusMult = 1 + (meta.goldBonus||0)*0.2;
  var earned = Math.floor((gold*0.45 + wave*12 + kills/4) * bonusMult);
  meta.goldBank += earned;
  high.wave = Math.max(high.wave, wave);
  high.kills = Math.max(high.kills, kills);
  high.level = Math.max(high.level, level);
  high.gold = Math.max(high.gold, Math.floor(gold));
  if(mode === "daily"){ high.dailyWave = Math.max(high.dailyWave, wave); }
  if(mode === "endless"){ high.endlessWave = Math.max(high.endlessWave, wave); }
  saveAll();
  return earned;
}

var CELL = 56, grid = {};
var _stamp = 0;

function buildGrid(){
  grid = {};

    var y0 = Math.floor((e.y-e.radius)/CELL), y1 = Math.floor((e.y+e.radius)/CELL);
    for(var cx=x0;cx<=x1;cx++){

}

function queryRect(x0,y0,x1,y1){

  var cy0 = Math.floor(y0/CELL), cy1 = Math.floor(y1/CELL);
  for(var cx=cx0;cx<=cx1;cx++){
    for(var cy=cy0;cy<=cy1;cy++){

function chooseEnemyType(){

  function add(t,w){ if(w > 0){ weights[t] = (weights[t]||0)+w; } }
  if(wave >= 3+delay){ add("fast",22); }
  if(wave >= 4+delay){ add("tank",16); }
  if(wave >= 5+delay){ add("splitter",16); }
  if(wave >= 6+delay){ add("ghost",18); }
  add("bomber",(wave >= 7+delay ? 14 : 0)+effectiveMods.bomberWeight);
  if(wave >= 8+delay){ add("elite",10); }
  add("shield",(wave >= 9+delay ? 12 : 0)+effectiveMods.shieldWeight);
  add("healer",(wave >= 10+delay ? 10 : 0)+effectiveMods.healerWeight);
  add("summoner",(wave >= 11+delay ? 10 : 0)+effectiveMods.summonWeight);
  add("charger",(wave >= 12+delay ? 14 : 0)+effectiveMods.chargerWeight);
  add("ranged",(wave >= 13+delay ? 12 : 0)+effectiveMods.rangedWeight);
  if(wave >= 15){ add("elite",20); }
  if(wave >= 16){ add("shield",18); }
  add("juggernaut",(wave >= 17+delay ? 10 : 0)+effectiveMods.juggernautWeight);
  add("wraith",(wave >= 19+delay ? 12 : 0)+effectiveMods.wraithWeight);
  add("hive",(wave >= 21+delay ? 10 : 0)+effectiveMods.hiveWeight);
  if(wave >= 14){ weights.normal += 10; }
  if(wave >= 18){ weights.fast += 12; }
  if(wave >= 22){ weights.tank += 10; }
  if(wave >= 26){ weights.splitter += 8; }
  var list = [];
  for(var k in weights){ list.push({type:k,weight:weights[k]}); }
  return weightedOne(list);
}

    if(d < best){ best = d; target = e; }
  }
  if(!target){ return; }
  var desired = Math.atan2(target.y-b.y,target.x-b.x), current = Math.atan2(b.vy,b.vx);
  var diff = desired-current;
  while(diff > Math.PI){ diff -= Math.PI*2; }
  while(diff < -Math.PI){ diff += Math.PI*2; }
  var maxTurn = 2.2*b.homing*dt, turn = clamp(diff,-maxTurn,maxTurn);
  var speed = Math.hypot(b.vx,b.vy), na = current+turn;
  b.vx = Math.cos(na)*speed; b.vy = Math.sin(na)*speed;
}
function segmentCircleHit(x1,y1,x2,y2,cx,cy,r){
  var dx = x2-x1, dy = y2-y1, fx = x1-cx, fy = y1-cy, a = dx*dx+dy*dy;
  if(a === 0){ var d0 = fx*fx+fy*fy; return d0 <= r*r ? 0 : -1; }
  var t = clamp(-(fx*dx+fy*dy)/a,0,1);
  var px = x1+dx*t, py = y1+dy*t, ddx = px-cx, ddy = py-cy;
  return ddx*ddx+ddy*ddy <= r*r ? t : -1;
}
function getSkillTarget(){
  if(hasPointerAim && Number.isFinite(pointerX) && Number.isFinite(pointerY)){
    return {x:clamp(pointerX,40,W-40), y:clamp(pointerY,80,H-120)};
  }
  var alive = [];
  for(var i=0;i<enemies.length;i++){ if(!enemies[i].dead){ alive.push(enemies[i]); } }
  if(!alive.length){ return {x:defense.x, y:clamp(defense.y-220,80,H-120)}; }
  var bestX = alive[0].x, bestY = clamp(alive[0].y,80,H-120), bestCount = -1;
  var samples = Math.min(alive.length,14);
  for(var s=0;s<samples;s++){
    var e = alive[Math.floor(_rng()*alive.length)];
    var c = 0;
    var near = queryRect(e.x-150,e.y-150,e.x+150,e.y+150);
    for(var j=0;j<near.length;j++){
      var o = near[j];
      if(o.dead){ continue; }
      if((o.x-e.x)*(o.x-e.x)+(o.y-e.y)*(o.y-e.y) <= 150*150){ c++; }
    }
    if(c > bestCount){ bestCount = c; bestX = e.x; bestY = clamp(e.y,80,H-120); }
  }
  if(bestCount > 0){ return {x:clamp(bestX,40,W-40), y:bestY}; }
  return {x:defense.x, y:clamp(defense.y-220,80,H-120)};
}

function useSkill(key){ castSkill(key,false); }

function autoSkills(dt){
  if(!settings.autoSkills || state !== "playing" || !defense){ return; }
  autoSkillAcc += dt;
  if(autoSkillAcc < 0.25){ return; }
  autoSkillAcc = 0;
  var d = defense;
  var alive = 0, casters = 0, elites = 0, boss = false;
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead){ continue; }
    alive++;
    if(e.ranged || e.summon || e.healAura > 0){ casters++; }
    if(e.elite){ elites++; }
    if(e.isBoss){ boss = true; }
  }
  var hpRatio = d.hp / Math.max(1,d.maxHp);
  if((d.skillCd.shield||0) <= 0 && d.shieldHp <= 0 && (hpRatio < 0.55 || barricade.hp/Math.max(1,barricade.maxHp) < 0.55 || alive > 22)){ useSkill("shield"); return; }
  if((d.skillCd.emp||0) <= 0 && (enemyBullets.length > 10 || casters > 4 || alive > 20)){ useSkill("emp"); return; }
  if((d.skillCd.stasis||0) <= 0 && alive > 18 && hpRatio < 0.85){ useSkill("stasis"); return; }
  if((d.skillCd.area||0) <= 0 && alive > 12){ useSkill("area"); return; }
  if((d.skillCd.frenzy||0) <= 0 && (alive > 14 || boss)){ useSkill("frenzy"); return; }
  if((d.skillCd.sniper||0) <= 0 && (boss || elites > 0 || alive > 8)){ useSkill("sniper"); return; }
  if((d.skillCd.mines||0) <= 0 && alive > 10){ useSkill("mines"); return; }
  if((d.skillCd.drone||0) <= 0 && alive > 8){ useSkill("drone"); return; }
}

function pickBuff(b){
  if(state !== "levelup"){ return; }
  if(b.isMax && b.isMax()){ return; }
  stopLevelupCountdown();
  ensureDefense();
  var times = b.rarity === "legendary" ? 1 : levelBatch;
  for(var i=0;i<times;i++){ b.apply(); }
  buffCounts[b.id] = (buffCounts[b.id]||0)+times;
  if(b.rarity && b.rarity !== "common"){ rarePity = 0; } else { rarePity++; }
  pendingLevels = Math.max(0, pendingLevels-levelBatch);
  checkResonances(); ensureDefense();
  spawnParticles(defense.x,defense.y,"#38bdf8",12,180);
  spawnRing(defense.x,defense.y,55,"#38bdf8");
  announce("選擇 "+b.title);
  finishLevelUp();
}
function finishLevelUp(){
  hideOverlay(); state = "playing";
  updateMusicPlayback(); updateSkillButtons();
  if(pendingLevels > 0){ openLevelUp(afterLevelTarget); }
  else if(afterLevelTarget === "shop"){ afterLevelTarget = null; openShop(); }
}
function checkLevelUp(){
  if(state !== "playing"){ return; }
  if(!Number.isFinite(exp)){ exp = 0; }
  if(!Number.isFinite(expNeed) || expNeed <= 0){ expNeed = 20; }
  while(exp >= expNeed){
    exp -= expNeed; level++;
    expNeed = Math.floor(expNeed*1.24+9);
    pendingLevels++; SFX.level();
  }
  if(pendingLevels > 0 && (enemies.length < 12 || pendingLevels >= 4)){ openLevelUp(); }
}
function createCard(title,desc,onClick,disabled){
  var btn = document.createElement("button");
  btn.className = "card";
  if(disabled){ btn.classList.add("disabled"); btn.disabled = true; }
  var strong = document.createElement("strong"); strong.textContent = title;
  var span = document.createElement("span"); span.textContent = desc;
  btn.appendChild(strong); btn.appendChild(span);
  if(!disabled && onClick){ btn.addEventListener("click", onClick); }
  return btn;
}
function createStatCard(label,value,count,capText,maxed){
  var div = document.createElement("div");
  div.className = "card stat-card";
  var strong = document.createElement("strong"); strong.textContent = label;
  var text = value;
  if(count !== null && count !== undefined){ text += "\n已選："+count+" 次"; }
  if(capText){ text += "\n"+capText; }
  if(maxed){ text += "\n已達上限"; }
  var span = document.createElement("span"); span.textContent = text;
  div.appendChild(strong); div.appendChild(span);
  return div;
}
function renderLevelUpCards(){
  overlayTitle.textContent = "升級選擇";
  overlayDesc.textContent = "本次一次領取 "+levelBatch+" 級強化（效果疊加 "+levelBatch+" 次）。";
  cardsEl.innerHTML = "";
  restartBtn.style.display = "none";
  currentChoices.forEach(function(b){
    var maxed = b.isMax && b.isMax();
    var desc = b.desc+"\n已選："+(buffCounts[b.id]||0)+" 次";
    if(levelBatch > 1 && b.rarity !== "legendary"){ desc += "\n×"+levelBatch+" 生效"; }
    if(b.rarity){ desc += "\n稀有度："+(RARITY_CN[b.rarity]||b.rarity); }
    if(maxed){ desc += "\n已達上限"; }
    cardsEl.appendChild(createCard(b.title,desc,function(){ pickBuff(b); },maxed));
  });
}
function openLevelUp(target){
  ensureDefense();
  var pool = getLevelUpPool(), evo = getEvolutionPool();
  if(pool.length === 0 && evo.length === 0){
    heal(defense.maxHp*0.5,true);
    pendingLevels = Math.max(0,pendingLevels-1);
    finishLevelUp();
    return;
  }
  afterLevelTarget = target || null;
  levelBatch = Math.max(1, Math.min(3, pendingLevels));
  state = "levelup";
  currentChoices = weightedChoices(pool,3);
  if(evo.length > 0 && (nextLevelupRareBoost || _rng() < 0.65)){
    var e = evo[Math.floor(_rng()*evo.length)];
    currentChoices.unshift({id:e.id,title:e.title,desc:e.desc+"（進化）",weight:99,rarity:"legendary",
      isMax:function(){ return false; },
      apply:(function(ev){ return function(){ defense.evolutions[ev.id] = true; }; })(e)});
    nextLevelupRareBoost = false;
  }
  currentChoices = currentChoices.slice(0,3);
  renderLevelUpCards();
  overlay.classList.add("active");
  startLevelupCountdown(true);
  updateSkillButtons();
  announce("升級選擇，請選擇強化");
}

    var maxed = item.isMax ? item.isMax() : false;
    var tooCheap = item.id !== "leave" && item.cost > gold;
    var disabled = item.id !== "leave" && (maxed || tooCheap);
    var desc = item.desc+"\n價格："+item.cost+" 金";
    if(maxed){ desc += "\n已達上限"; }
    if(tooCheap && !maxed){ desc += "\n金幣不足"; }

  });
  updateShopTimerText();

function openShop(){
  state = "shop";
  stopLevelupCountdown(); stopShopCountdown();
  currentShopItems = getShopItems();
  renderShopCards();
  overlay.classList.add("active");
  startShopCountdown(true);
  updateSkillButtons();
}
function leaveShop(){
  if(state !== "shop"){ return; }
  stopShopCountdown();
  if(pendingLevels > 0){ openLevelUp(); return; }
  hideOverlay(); state = "playing";
  updateMusicPlayback(); updateSkillButtons();
}
function pickShopItem(item){
  if(state !== "shop"){ return; }
  if(item.id === "leave"){ leaveShop(); return; }
  if(item.isMax && item.isMax()){ return; }
  if(item.cost > gold){ return; }
  gold -= item.cost;
  item.apply();
  ensureDefense();
  if(item.buffId){ buffCounts[item.buffId] = (buffCounts[item.buffId]||0)+1; }
  checkResonances(); SFX.shop();
  currentShopItems = getShopItems();
  renderShopCards();
  updateSkillButtons();
}

function applySettings(){

  else if(settings.quality === "mid"){ quality = 0.6; }

function openPanel(kind){
  if(["playing","paused","levelup","shop","start"].indexOf(state) < 0){ return; }
  panelReturn = state;
  if(state === "levelup"){ stopLevelupCountdown(); }
  if(state === "shop"){ stopShopCountdown(); }
  stopMusic();
  state = kind;
  if(kind === "stats"){ renderStats(); }
  else if(kind === "codex"){ renderCodex(); }
  else{ renderSettings(); }
  startScreen.classList.remove("active");
  overlay.classList.add("active");
  updateSkillButtons();
}
function closePanel(){
  if(["stats","settings","codex"].indexOf(state) < 0){ return; }
  rebinding = null;
  state = panelReturn;
  if(state === "playing"){ hideOverlay(); }
  else if(state === "start"){ hideOverlay(); startScreen.classList.add("active"); renderMeta(); }
  else if(state === "paused"){ renderPauseCards(); overlay.classList.add("active"); }
  else if(state === "levelup"){ renderLevelUpCards(); overlay.classList.add("active"); startLevelupCountdown(false); }
  else if(state === "shop"){ renderShopCards(); overlay.classList.add("active"); startShopCountdown(false); }
  updateMusicPlayback(); updateSkillButtons();
}
function gameOver(){
  state = "gameover";
  stopMusic(); stopLevelupCountdown(); stopShopCountdown();
  SFX.over(); vibrate([80,60,120]);
  var earned = settleRun();
  var modeName = mode === "daily" ? "每日" : mode === "endless" ? "無盡" : "一般";
  var txt = "第 "+wave+" 波（"+modeName+"）\n殺敵 "+kills+"｜等級 "+level+"｜金幣 "+Math.floor(gold)+
    "\n最高連擊 x"+maxCombo+"｜總傷害 "+Math.floor(totalDamage)+
    "\n獲得永久金幣 +"+earned+
    "\n最高紀錄：波 "+high.wave+"｜殺 "+high.kills;
  if(mode !== "std"){ txt += "\n種子："+runSeed; }
  overlayTitle.textContent = "遊戲結束";
  overlayDesc.textContent = txt;
  levelupTimerEl.textContent = "";
  cardsEl.innerHTML = "";
  restartBtn.style.display = "inline-block";
  overlay.classList.add("active");
  renderMeta();
  updateSkillButtons();
  announce("遊戲結束，第 "+wave+" 波");
}

/* ---------- BOSS ---------- */
function checkBossPhase(e){
  var ratio = e.hp/e.maxHp;
  if(e.bossPhase < 1 && ratio <= 0.7){
    e.bossPhase = 1; e.speed *= 1.15; e.bossSkillTimer = 0.5;
    spawnRing(e.x,e.y,e.radius+20,"#f87171");
    spawnShockwave(e.x,e.y,e.radius*3,"rgba(248,113,113,0.7)");
    SFX.boss();
    for(var i=0;i<3;i++){ spawnEnemy(Math.random()<0.5?"fast":"normal",{x:e.x+rand(-60,60),y:e.y+rand(-10,20),hpMult:0.9,speedMult:1.2,expMult:0.35,goldMult:0.35}); }
  }
  if(e.bossPhase < 2 && ratio <= 0.4){
    e.bossPhase = 2; e.speed *= 1.2; e.bossShieldTimer = 3; e.bossSkillTimer = 0.4;
    spawnRing(e.x,e.y,e.radius+30,"#38bdf8");
    spawnShockwave(e.x,e.y,e.radius*3.4,"rgba(56,189,248,0.7)");
    SFX.boss();
    for(var k=-2;k<=2;k++){ spawnEnemyBullet(e.x,e.y,Math.PI/2+k*0.22,140+wave*2,7+wave*0.35,5,"#f87171"); }
  }
  if(e.bossPhase < 3 && ratio <= 0.15){
    e.bossPhase = 3; e.speed *= 1.25; e.bossSkillTimer = 0.2;
    spawnRing(e.x,e.y,e.radius+40,"#facc15");
    spawnShockwave(e.x,e.y,e.radius*3.8,"rgba(250,204,21,0.7)");
    SFX.boss();
    for(var j=0;j<4;j++){ spawnEnemy(Math.random()<0.5?"elite":"fast",{x:e.x+rand(-80,80),y:e.y+rand(-10,30),hpMult:0.8,speedMult:1.2,expMult:0.4,goldMult:0.4}); }
  }
}
function updateBossSkills(e,dt){
  if(e.bossShieldTimer > 0){ e.bossShieldTimer -= dt; }
  if(e.bossChargeTimer > 0){ e.bossChargeTimer -= dt; }
  e.bossSkillTimer -= dt;
  if(e.bossSkillTimer > 0){ return; }
  var v = e.bossVariant, i;
  if(v === 0){
    var count = 3+e.bossPhase;
    var kinds = ["fast","normal","summoner","healer"];
    for(i=0;i<count;i++){ spawnEnemy(kinds[i%4],{x:e.x+rand(-80,80),y:e.y+rand(-10,30),hpMult:0.85,speedMult:1.15,expMult:0.3,goldMult:0.3}); }
    SFX.boss();
    e.bossSkillTimer = Math.max(2.0, 6.5-e.bossPhase*1.2);
  } else if(v === 1){
    if(_rng() < 0.55){
      e.bossChargeTimer = 1.6; e.bounceFlash = 0.3;
      spawnParticles(e.x,e.y,"#ef4444",20,240);
      SFX.boss();
    } else {
      for(i=0;i<2+e.bossPhase;i++){ spawnEnemy("charger",{x:e.x+rand(-70,70),y:e.y+rand(0,25),hpMult:0.8,speedMult:1.1,expMult:0.3,goldMult:0.3}); }
      SFX.boss();
    }
    e.bossSkillTimer = Math.max(1.5, 5.5-e.bossPhase*1.1);
  } else {
    var cnt = 4+e.bossPhase*2;
    for(i=0;i<cnt;i++){
      var spread = (i-(cnt-1)/2)*0.16;
      spawnEnemyBullet(e.x,e.y,Math.PI/2+spread,130+wave*2,5.5+wave*0.3,5,"#f87171");
    }
    if(_rng() < 0.4){ spawnEnemy("ranged",{x:e.x+rand(-60,60),y:e.y+10,hpMult:1.1,speedMult:0.9,expMult:0.4,goldMult:0.4}); }
    if(e.bossPhase >= 2 && _rng() < 0.4){ e.bossShieldTimer = 3; }
    SFX.boss();
    e.bossSkillTimer = Math.max(1.6, 6-e.bossPhase*1.2);
  }
}

/* ---------- 更新 ---------- */
function updateTimers(dt){
  var d = defense, i, k;
  if(d.recoil > 0){ d.recoil = Math.max(0,d.recoil-28*dt); }
  if(d.muzzleFlash > 0){ d.muzzleFlash = Math.max(0,d.muzzleFlash-dt); }
  if(d.hurtFlash > 0){ d.hurtFlash = Math.max(0,d.hurtFlash-dt); }
  d.heat = Math.max(0,d.heat-dt*0.55);
  if(screenFlash > 0){ screenFlash = Math.max(0,screenFlash-dt*2.2); }
  if(d.shieldTimer > 0){ d.shieldTimer -= dt; }
  if(d.shieldHp > 0 && d.shieldTimer <= 0){ d.shieldHp = 0; }
  if(d.frenzyTimer > 0){ d.frenzyTimer -= dt; }
  if(d.hunterTimer > 0){ d.hunterTimer -= dt; }
  if(d.empTimer > 0){ d.empTimer -= dt; }
  if(d.stasisTimer > 0){
    d.stasisTimer -= dt;
    if(d.stasisTimer <= 0){
      for(i=0;i<enemyBullets.length;i++){ spawnParticles(enemyBullets[i].x,enemyBullets[i].y,"#67e8f9",4,140); }
      enemyBullets.length = 0;
      spawnRing(d.x,d.y,260,"#67e8f9");
    }
  }
  if(d.areaTimer > 0){
    d.areaTimer -= dt;
    var elapsed = 5.2-d.areaTimer;
    if(!d.areaOrbitalDone && elapsed >= 1.15){
      d.areaOrbitalDone = true; d.orbitalTimer = 2.1;
      d.orbitalTargetX = d.areaTargetX; d.orbitalX = d.areaTargetX;
      SFX.orb();
      addDamageText(d.areaTargetX, clamp(d.areaTargetY-30,80,H-120), "範圍技：軌道", "#4ade80");
    }
    if(!d.areaAirstrikeDone && elapsed >= 3.45){
      d.areaAirstrikeDone = true; d.airstrikeTimer = 1.3; d.airstrikeSpawn = 0.08;
      d.airstrikeTargetX = d.areaTargetX; d.airstrikeTargetY = d.areaTargetY;
      SFX.air();
      addDamageText(d.areaTargetX, clamp(d.areaTargetY-30,80,H-120), "範圍技：空襲", "#fb923c");
    }
    if(d.areaTimer <= 0){ d.areaTargetX = NaN; d.areaTargetY = NaN; }
  }
  if(d.orbitalTimer > 0){ updateOrbital(dt); }
  else if(Number.isFinite(d.orbitalTargetX)){ d.orbitalTargetX = NaN; }
  if(d.airstrikeTimer > 0){
    d.airstrikeTimer -= dt; d.airstrikeSpawn -= dt;
    if(d.airstrikeSpawn <= 0){
      d.airstrikeSpawn = 0.16;
      if(Number.isFinite(d.airstrikeTargetX)){
        airstrikes.push({x:clamp(d.airstrikeTargetX+rand(-120,120),30,W-30), y:clamp(d.airstrikeTargetY+rand(-100,100),140,H-210), life:0.6});
      } else {
        airstrikes.push({x:rand(30,W-30), y:rand(140,H-210), life:0.6});
      }
    }
    if(d.airstrikeTimer <= 0){ d.airstrikeTargetX = NaN; d.airstrikeTargetY = NaN; }
  }
  updateAirstrikes(dt);
  updateFires(dt);
  for(i=flashes.length-1;i>=0;i--){ flashes[i].life -= dt; if(flashes[i].life <= 0){ flashes.splice(i,1); } }
  for(i=0;i<SKILL_KEYS.length;i++){
    k = SKILL_KEYS[i];
    if(d.skillCd[k] > 0){ d.skillCd[k] = Math.max(0,d.skillCd[k]-dt); }
  }
  if(settings.autoSkills){ autoSkills(dt); }
  if(d.evolutions.shieldRegen && d.shieldHp > 0){ heal(1.2*dt,false); }
  if(chestCooldown > 0){ chestCooldown = Math.max(0,chestCooldown-dt); }
  if(comboTimer > 0){ comboTimer -= dt; if(comboTimer <= 0){ combo = 0; } }
  if(comboTimer <= 0){ superMeter = Math.max(0,superMeter-16*dt); }
  if(superMeter >= 50 && superFired < 1){ superFired = 1; addDamageText(d.x,d.y-70,"超能：範圍技","#fde047",true); SFX.super(); castSkill("area",true); }
  if(superMeter >= 100 && superFired < 2){ superFired = 2; addDamageText(d.x,d.y-70,"超能：電磁脈衝","#a78bfa",true); SFX.super(); castSkill("emp",true); }
  if(superMeter < 50){ superFired = 0; }
  if(d.regen > 0){ heal(d.regen*dt,false); }
  if(effectiveMods.selfDamagePerSec > 0){
    d.hp -= effectiveMods.selfDamagePerSec*dt;
    if(d.hp <= 0){ d.hp = 0; gameOver(); }
  }
  if(d.evolutions.chainStorm){
    chainStormTimer -= dt;
    if(chainStormTimer <= 0){
      chainStormTimer = 4.5;
      var alive = enemies.filter(function(e){ return !e.dead; });
      if(alive.length){
        var src = alive[Math.floor(_rng()*alive.length)];
        chainLightning(src.x,src.y,Math.min(5,2+d.chain),d.damage*0.65,[],true);
      }
    }
  }
  if(waveBannerTimer > 0){ waveBannerTimer -= dt; }
  if(bossWarningTimer > 0){ bossWarningTimer -= dt; }
  lightningTimer -= dt;
  if(lightningTimer <= 0){ lightningTimer = rand(5,14); lightningFlash = 0.5*flashScale(); lightningX = rand(40,W-40); }
  if(lightningFlash > 0){ lightningFlash -= dt; }
  ambientTimer -= dt;
  if(ambientTimer <= 0){
    ambientTimer = 0.3;
    if(particles.length < particleLimit()-12){
      var warm = _rng() < 0.35;
      addParticle({type:"dot",x:rand(0,W),y:warm?rand(H-220,H-60):rand(200,H-80),vx:rand(-14,14),vy:warm?rand(-40,-18):rand(-20,-5),life:rand(1.2,2.8),max:2.8,color:warm?"rgba(251,146,60,0.30)":"rgba(148,163,184,0.18)",r:rand(1.2,2.4)});
    }
  }
  updatePlumes(dt);
  updateFlyers(dt);
  dmgFlush -= dt;
  if(dmgFlush <= 0){ flushDamageText(); dmgFlush = 0.16; }
  updateParticles(dt);
  updateDecals(dt);
}
function updatePlumes(dt){
  if(quality <= 0.4){ return; }
  for(var i=0;i<plumes.length;i++){
    plumes[i].p += dt*plumes[i].s;
    if(plumes[i].p > 1){ plumes[i].p -= 1; }
  }
}
function updateFlyers(dt){
  if(quality <= 0.45){ return; }
  for(var i=flyers.length-1;i>=0;i--){
    var f = flyers[i];
    f.x += f.vx*dt; f.y += f.vy*dt; f.blink += dt;
    if(f.blink > 1){ f.blink -= 1; }
    if(f.x < -40 || f.x > W+40 || f.y < -40 || f.y > H){ flyers.splice(i,1); }
  }
  if(_rng() < dt*0.08 && flyers.length < 2){

function checkObjective(){

function update(dt){
  if(!Number.isFinite(dt) || dt <= 0){ return; }
  ensureDefense();
  if(!Number.isFinite(gameTime)){ gameTime = 0; }
  gameTime += dt;
  updateTimers(dt);
  if(state !== "playing"){ return; }
  buildGrid();
  var move = 0;
  if(keys.ArrowLeft || keys.a || keys.A){ move -= 1; }
  if(keys.ArrowRight || keys.d || keys.D){ move += 1; }
  if(joyActive){ move = clamp(joyX-joyOriginX,-80,80)/80; }
  if(move !== 0){
    defense.x += move*defense.speed*effectiveMods.defenseSpeedMult*dt;
    defense.treadPhase += move*dt*60;
    targetX = defense.x;
    usingPointer = false;
    defense.dustTimer -= dt;
    if(defense.dustTimer <= 0 && quality > 0.5){
      defense.dustTimer = 0.08;
      addParticle({type:"smoke",x:defense.x-Math.sign(move)*20+rand(-6,6),y:defense.y+12,vx:-move*rand(20,60),vy:rand(-30,-8),r:rand(4,9),life:rand(0.3,0.6),max:0.6,color:"rgba(148,163,184,0.16)"});
    }
  } else if(usingPointer){
    var step = clamp(targetX-defense.x,-defense.speed*dt,defense.speed*dt);
    defense.x += step;
    defense.treadPhase += step/4;
  }
  defense.x = clamp(defense.x,12,W-12);
  updateAim();
  defense.fireCooldown -= dt;
  var hunterMult = defense.hunterTimer > 0 ? 0.8 : 1;
  var efr = defense.fireRate*effectiveMods.playerFireRateMult*(defense.frenzyTimer>0?0.6:1)*hunterMult;
  if(defense.fireCooldown <= 0){ fire(); defense.fireCooldown = efr; }
  updateBullets(dt); if(state !== "playing"){ return; }
  updateEnemies(dt); if(state !== "playing"){ return; }
  updateEnemyBullets(dt); if(state !== "playing"){ return; }
  updateOrbs(dt); updateBlackholes(dt); updateMines(dt); updateDrones(dt);
  if(!Number.isFinite(exp)){ exp = 0; }
  if(!Number.isFinite(expNeed) || expNeed <= 0){ expNeed = 20; }
  if(!Number.isFinite(gold)){ gold = 0; }
  if(!Number.isFinite(kills)){ kills = 0; }
  checkObjective();
  checkLevelUp(); if(state !== "playing"){ return; }
  waveTimer += dt;
  if(waveStats){ waveStats.fastTimer = waveTimer; }
  if(waveTimer >= waveDuration){
    wave++; waveTimer = 0; bossSpawnedInWave = false;
    waveBannerText = "WAVE "+wave; waveBannerTimer = 1.8;
    chestWaveLimit = Math.min(3,1+Math.floor(wave/8));
    chestWaveCount = 0;
    chestCooldown = Math.max(chestCooldown,1.2);
    if(wave % 5 === 0){ rollMutation(); }
    rollWaveModifiers(); rollObjective();
    var es = getEarlyScale();
    spawnInterval = Math.max(0.24,(1.55-(wave-1)*0.034-Math.max(0,wave-18)*0.012)*currentDifficulty.spawnMult*es.spawn/effectiveMods.enemyCountMult*(mode==="endless"?0.85:1));
    spawnTimer = 0;
    if(defense.waveHeal > 0){ heal(defense.maxHp*defense.waveHeal,true); }
    barricade.hp = Math.min(barricade.maxHp, barricade.hp+barricade.maxHp*0.08);
    SFX.waveEnd();
    announce("第 "+wave+" 波開始");
    if(wave % 10 === 0){ spawnChestEnemy(W/2,-40); }
    if(wave % 4 === 0){
      for(var i=0;i<3;i++){ spawnEnemy(_rng()<0.5?"charger":"ranged",{x:rand(40,W-40),y:-20-i*25,elite:wave>=12&&_rng()<0.4}); }
    }
    if(wave % 3 === 0){
      if(pendingLevels > 0){ openLevelUp("shop"); return; }
      openShop(); return;
    }
  }
  if(wave % 5 === 0 && !bossSpawnedInWave && waveTimer > waveDuration*0.65){
    spawnBoss(); bossSpawnedInWave = true; SFX.boss();
  }
  spawnTimer -= dt;
  if(spawnTimer <= 0){
    var es2 = getEarlyScale();
    var maxEnemies = Math.min(CONFIG.maxEnemies,(22+wave*3+(wave>15?(wave-15)*2.5:0))*es2.max);
    var count = Math.floor((1+Math.floor(wave/5)+(wave>=18?1:0)+(wave>=25?1:0))*effectiveMods.enemyCountMult);
    for(var j=0;j<count;j++){
      if(enemies.length >= maxEnemies){ break; }
      spawnEnemy(chooseEnemyType(),{});
    }
    spawnTimer = spawnInterval;
  }
}

  var boss = bossRef, x = 12, y = hudBottomY(), w = W-24, h = 8;
  ctx.fillStyle = "rgba(15,23,42,0.85)";
  roundRect(ctx,x,y,w,h,4); ctx.fill();
  var g = ctx.createLinearGradient(x,y,x+w,y);
  g.addColorStop(0,"#f87171"); g.addColorStop(1,"#ef4444");
  ctx.fillStyle = g;
  roundRect(ctx,x,y,w*clamp(boss.hp/boss.maxHp,0,1),h,4); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  roundRect(ctx,x,y,w*clamp(boss.hp/boss.maxHp,0,1),3,2); ctx.fill();
  ctx.fillStyle = "#f8fafc"; ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  var names = ["BOSS 召喚者","BOSS 衝角","BOSS 砲台"];
  ctx.fillText(names[boss.bossVariant] || "BOSS", x, y+14);
  if(boss.bossShieldTimer > 0){
    ctx.textAlign = "right"; ctx.fillStyle = "#38bdf8";
    ctx.fillText("護盾", x+w, y+14);
    ctx.textAlign = "left";
  }
}
function drawAsh(){
  if(quality <= 0.45){ return; }
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for(var i=0;i<14;i++){
    var t = gameTime*0.12+i*0.71;
    var x = (i*67+Math.sin(t*1.3)*40)%W;
    var y = H-((t*36+i*90)%(H-260));
    ctx.globalAlpha = 0.10+0.08*Math.sin(t*2+i);
    ctx.fillStyle = i%3 ? "rgba(251,146,60,0.7)" : "rgba(226,232,240,0.6)";
    ctx.beginPath(); ctx.arc(x,y,1.4,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
var MUTATION_TINT = {
  iceAge:"rgba(56,189,248,0.06)", blastEra:"rgba(251,146,60,0.05)", goldRain:"rgba(250,204,21,0.04)",
  eliteHunt:"rgba(168,85,247,0.05)", swarm:"rgba(132,204,22,0.04)", fortress:"rgba(56,189,248,0.05)",
  glass:"rgba(248,113,113,0.05)", berserk:"rgba(245,158,11,0.05)", bulletEra:"rgba(234,179,8,0.05)",
  armoredEra:"rgba(148,163,184,0.06)", ghostEra:"rgba(34,211,238,0.06)", juggernautEra:"rgba(71,85,105,0.08)",
  slowHeavy:"rgba(148,163,184,0.05)", splitFrenzy:"rgba(250,204,21,0.04)", skillFrenzy:"rgba(167,139,250,0.05)",
  magnetFlip:"rgba(125,211,252,0.04)"
};
function render(){
  ensureDefense();
  glowBudget = settings.highFx ? (quality >= 0.9 ? 130 : quality >= 0.6 ? 60 : 0) : 0;
  var i;
  ctx.drawImage(bgFar, layerOffset(0.05), 0);
  drawDynamicBackgroundFx();
  ctx.drawImage(bgGround, 0, 0);
  if(activeMutation){
    var col = MUTATION_TINT[activeMutation.id];
    if(col){ ctx.fillStyle = col; ctx.fillRect(0,0,W,H); }
  }
  for(i=0;i<decals.length;i++){
    var dc = decals[i];
    ctx.globalAlpha = clamp(dc.life/dc.max,0,0.28);
    ctx.fillStyle = dc.color;
    ctx.beginPath(); ctx.ellipse(dc.x,dc.y,dc.r,dc.r*0.45,0,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if(state === "playing"){ drawBottomControlArea(); }
  drawFlashes();
  drawFires();
  drawMines();
  for(i=0;i<blackholes.length;i++){
    var bh = blackholes[i];
    if(!Number.isFinite(bh.x) || !Number.isFinite(bh.y)){ continue; }
    var rr = bh.radius*clamp(bh.life/3,0,1);
    drawGlowCircle(bh.x,bh.y,bh.radius,"#c084fc",0.2);
    ctx.fillStyle = "rgba(0,0,0,0.82)";
    ctx.beginPath(); ctx.arc(bh.x,bh.y,rr,0,Math.PI*2); ctx.fill();
    ctx.save();
    ctx.translate(bh.x,bh.y); ctx.rotate(gameTime*1.8);
    for(var k=0;k<3;k++){
      ctx.strokeStyle = "rgba(192,132,252,"+(0.5-k*0.13)+")";
      ctx.lineWidth = 3-k*0.7;
      ctx.beginPath();
      ctx.ellipse(0,0,rr*(1.15+k*0.18),rr*(0.34+k*0.06),k*0.5,k*0.6,k*0.6+2.4);
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(192,132,252,0.75)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bh.x,bh.y,rr,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = "rgba(226,232,240,0.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bh.x,bh.y,rr*1.06,0,Math.PI*2); ctx.stroke();
  }
  for(i=0;i<orbs.length;i++){
    var o = orbs[i];
    if(Number.isFinite(o.x) && Number.isFinite(o.y)){ drawOrb(o); }
  }
  for(i=0;i<enemyBullets.length;i++){
    var eb = enemyBullets[i];
    if(!Number.isFinite(eb.x) || !Number.isFinite(eb.y)){ continue; }
    var frozen = defense.stasisTimer > 0;
    ctx.fillStyle = frozen ? "#67e8f9" : eb.color;
    ctx.beginPath(); ctx.arc(eb.x,eb.y,eb.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = frozen ? "rgba(103,232,249,0.25)" : "rgba(248,113,113,0.25)";
    ctx.beginPath(); ctx.arc(eb.x,eb.y,eb.r+3,0,Math.PI*2); ctx.fill();
  }
  drawOrbitalBeam();
  drawAirstrikeMarkers();
  for(i=0;i<bullets.length;i++){
    var b = bullets[i];
    if(Number.isFinite(b.x) && Number.isFinite(b.y)){ drawBullet(b); }
  }
  for(i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead){ continue; }
    if(!Number.isFinite(e.x) || !Number.isFinite(e.y) || !Number.isFinite(e.radius)){ continue; }
    drawEnemy(e);
  }
  if(state === "playing"){ drawThreatArrows(); drawAimGuide(); }
  drawBarricade();
  drawDefense();
  drawDrones();
  for(i=0;i<particles.length;i++){
    var p = particles[i];
    if(!Number.isFinite(p.life)){ continue; }
    ctx.globalAlpha = clamp(p.life/p.max,0,1);
    if(p.type === "dot"){
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r||3,0,Math.PI*2); ctx.fill();
    } else if(p.type === "text"){
      ctx.fillStyle = p.color;
      ctx.font = "bold "+(p.big?18:14)+"px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0,0,0,0.65)"; ctx.shadowBlur = 3;
      ctx.fillText(String(p.value),p.x,p.y);
      ctx.shadowBlur = 0;
    } else if(p.type === "line"){
      ctx.strokeStyle = p.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x1,p.y1); ctx.lineTo(p.x2,p.y2); ctx.stroke();
    } else if(p.type === "ring"){
      ctx.strokeStyle = p.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.radius,0,Math.PI*2); ctx.stroke();
    } else if(p.type === "smoke"){
      ctx.fillStyle = p.color; ctx.globalAlpha *= 0.55;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    } else if(p.type === "gib"){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      roundRect(ctx,-p.w/2,-p.h/2,p.w,p.h,1); ctx.fill();
      ctx.restore();
    } else if(p.type === "casing"){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-2.5,-1.2,5,2.4);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  drawAsh();
  drawStasisFx();
  if(screenFlash > 0){
    ctx.fillStyle = "rgba("+screenFlashColor+","+clamp(screenFlash*0.35,0,0.35)+")";
    ctx.fillRect(0,0,W,H);
  }
  if(state !== "start"){
    drawPostFx();
    drawColorGrade();
    drawEdgeGlow();
    drawLowHealthFx();
    drawWaveBanner();
    drawBossWarning();
    drawHud();
    drawBossBar();
  }
}
function updateQuality(dt){
  if(settings.quality !== "auto"){ return; }
  if(dt > 0){
    fpsSamples.push(1/dt);
    if(fpsSamples.length > 90){ fpsSamples.shift(); }
    var sum = 0;
    for(var i=0;i<fpsSamples.length;i++){ sum += fpsSamples[i]; }
    var avg = sum/fpsSamples.length;
    if(avg < 32){ quality = 0.35; }
    else if(avg < 45){ quality = 0.6; }
    else if(avg > 55){ quality = 1; }
    if(!settings.highFx && quality > 0.6){ quality = 0.6; }
  }
}
function frame(ts){
  try{
    if(!lastTime){ lastTime = ts; }
    var dt = Math.min(0.1,(ts-lastTime)/1000);
    lastTime = ts;
    updateQuality(dt);
    updateDuck();
    var step = dt;
    if(hitStop > 0){ hitStop = Math.max(0,hitStop-dt); step = dt*0.14; }
    if(state === "playing"){
      accumulator += step;
      var guard = 0;
      while(accumulator >= FIXED_STEP && state === "playing" && guard < 5){
        update(FIXED_STEP);
        accumulator -= FIXED_STEP;
        guard++;
      }
      if(accumulator > FIXED_STEP*5){ accumulator = 0; }
    } else {
      accumulator = 0;
    }
    render();
    skillUiAcc += dt;
    if(skillUiAcc >= 0.1){ skillUiAcc = 0; updateSkillButtons(); }
  }catch(err){
    console.error(err);
    showCrash(err);
  }
  requestAnimationFrame(frame);
}

/* ---------- 輸入 ---------- */
var aimOffsetY = isCoarse ? -46 : 0;
function isJoyZone(p){ return isCoarse ? (p.y > H-260 && p.x < W*0.42) : (p.y > H-150); }
function tryOpenPendingBadge(p){
  if(!levelBadgeRect || pendingLevels <= 0 || state !== "playing"){ return false; }
  if(p.x >= levelBadgeRect.x && p.x <= levelBadgeRect.x+levelBadgeRect.w &&
     p.y >= levelBadgeRect.y && p.y <= levelBadgeRect.y+levelBadgeRect.h){
    openLevelUp();
    return true;
  }
  return false;
}
canvas.addEventListener("pointerdown",function(e){
  if(state !== "playing"){ return; }
  var p = getCanvasCoords(e);
  if(!p){ return; }
  if(tryOpenPendingBadge(p)){ e.preventDefault(); return; }
  e.preventDefault();
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  var isMouse = e.pointerType === "mouse" || e.pointerType === "pen";
  if(isMouse){
    mouseDown = true;
    pointerX = p.x; pointerY = p.y+aimOffsetY; hasPointerAim = true;
    if(p.y > H-150){ pointerRoles[e.pointerId] = {role:"move"}; setPointerTarget(p); }
    else{ pointerRoles[e.pointerId] = {role:"aim"}; }
  } else {
    if(isJoyZone(p)){
      pointerRoles[e.pointerId] = {role:"joy"};
      joyActive = true; joyOriginX = p.x; joyX = p.x;
    } else {
      pointerRoles[e.pointerId] = {role:"aim"};
      pointerX = p.x; pointerY = p.y+aimOffsetY; hasPointerAim = true;
    }
  }
});
canvas.addEventListener("pointermove",function(e){
  if(state !== "playing"){ return; }
  var p = getCanvasCoords(e);
  if(!p){ return; }
  var role = pointerRoles[e.pointerId];
  if(role && role.role === "joy"){ joyX = p.x; return; }
  var isMouse = e.pointerType === "mouse" || e.pointerType === "pen";
  if(isMouse){
    pointerX = p.x; pointerY = p.y+aimOffsetY; hasPointerAim = true;
    if(role && role.role === "move"){ setPointerTarget(p); }
    else if(mouseDown && p.y > H-150){ setPointerTarget(p); }
  } else if(role && role.role === "aim"){
    pointerX = p.x; pointerY = p.y+aimOffsetY; hasPointerAim = true;
  }
});
function endPointer(e){
  var role = pointerRoles[e.pointerId];
  if(role && role.role === "joy"){ joyActive = false; }
  if(e.pointerType === "mouse" || e.pointerType === "pen"){ mouseDown = false; }
  delete pointerRoles[e.pointerId];
}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);
canvas.addEventListener("pointerleave",function(e){
  if((e.pointerType === "mouse" || e.pointerType === "pen") && !mouseDown){ hasPointerAim = false; }
});

window.addEventListener("keydown",function(e){
  var t = e.target;
  var inField = t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA" || t.isContentEditable);
  if(rebinding){
    if(e.key === "Escape"){
      rebinding = null;
      if(state === "settings"){ renderSettings(); }
      e.preventDefault();
      return;
    }
    var k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
    if(k){
      for(var i=0;i<SKILL_KEYS.length;i++){
        if(settings.keymap[SKILL_KEYS[i]] === k){ settings.keymap[SKILL_KEYS[i]] = ""; }
      }
      settings.keymap[rebinding] = k;
      saveSettings(); applySettings();
      if(state === "settings"){ renderSettings(); }
    }
    rebinding = null;
    e.preventDefault();
    return;
  }
  if(inField){ return; }
  keys[e.key] = true;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].indexOf(e.key) >= 0){ e.preventDefault(); }
  if(e.key === "Escape" || e.key === "p" || e.key === "P"){
    if(state === "playing"){ pauseGame(); }
    else if(state === "paused"){ resumeGame(); }
    else if(["stats","settings","codex"].indexOf(state) >= 0){ closePanel(); }
    return;
  }
  if(state === "levelup" && ["1","2","3"].indexOf(e.key) >= 0){
    var idx = Number(e.key)-1;
    if(currentChoices[idx]){ pickBuff(currentChoices[idx]); }
  }
  if(state === "shop" && /^[1-9]$/.test(e.key)){
    var si = Number(e.key)-1;
    if(currentShopItems[si]){ pickShopItem(currentShopItems[si]); }
  }
  if(state === "paused" && e.key === "Enter"){ resumeGame(); }
  if(["stats","settings","codex"].indexOf(state) >= 0 && e.key === "Enter"){ closePanel(); }
  if(state === "gameover" && e.key === "Enter"){ restartBtn.click(); }
  for(var s=0;s<SKILL_KEYS.length;s++){
    var hk = settings.keymap[SKILL_KEYS[s]];
    if(hk && (e.key === hk || e.key === hk.toLowerCase() || e.key === hk.toUpperCase())){
      castSkill(SKILL_KEYS[s],false);
      break;
    }
  }
});
window.addEventListener("keyup",function(e){ keys[e.key] = false; });

/* ---------- 選單繪製 ---------- */
function renderModeButtons(){
  modeBtns.std.classList.toggle("on", mode === "std");
  modeBtns.daily.classList.toggle("on", mode === "daily");
  modeBtns.endless.classList.toggle("on", mode === "endless");
}
function renderChassis(){
  chassisGridEl.innerHTML = "";
  chassisDefs.forEach(function(c){
    var unlocked = !!meta.unlocked[c.id];
    var b = document.createElement("button");
    b.className = "mini-btn chassis-btn"+(meta.chassis === c.id ? " sel" : "");
    b.disabled = !unlocked;
    b.textContent = unlocked ? c.name : "🔒 "+c.name+"\n"+c.cost+" 金";
    b.title = c.blurb;
    b.addEventListener("click",function(){
      try{
        if(!unlocked){
          if(meta.goldBank < c.cost){ return; }
          meta.goldBank -= c.cost;
          meta.unlocked[c.id] = true;
        }
        meta.chassis = c.id;
        saveAll(); renderChassis(); renderMeta();
      }catch(err){ showCrash(err); }
    });
    chassisGridEl.appendChild(b);
  });
}
function renderMeta(){
  var mult = (1+(meta.goldBonus||0)*0.2).toFixed(2);
  metaGoldEl.textContent = "永久金幣庫："+Math.floor(meta.goldBank)+"（結算加成 x"+mult+"）";
  highStatsEl.textContent = "最高：波 "+high.wave+"｜殺 "+high.kills+"｜Lv "+high.level+"｜每日 "+high.dailyWave+"｜無盡 "+high.endlessWave;
  metaUpgradesEl.innerHTML = "";
  metaUpgrades.forEach(function(up){
    var cost = up.base*((meta[up.id]||0)+1);
    var btn = document.createElement("button");
    btn.className = "mini-btn meta-btn";
    btn.textContent = up.title+"\n"+cost+" 金｜Lv "+(meta[up.id]||0);
    btn.disabled = meta.goldBank < cost;
    btn.addEventListener("click",function(){
      try{
        if(meta.goldBank < cost){ return; }
        meta.goldBank -= cost;
        meta[up.id] = (meta[up.id]||0)+1;
        saveAll(); renderMeta();
      }catch(err){ showCrash(err); }
    });
    metaUpgradesEl.appendChild(btn);
  });
  renderChassis();
  renderModeButtons();
}

/* ---------- UI 綁定 ---------- */
function safe(fn){
  return function(e){
    try{ fn(e); }catch(err){ showCrash(err); }
  };
}
function bindUI(){
  diffButtons.forEach(function(btn){
    btn.addEventListener("click", safe(function(){ startGame(btn.dataset.diff); }));
  });
  restartBtn.addEventListener("click", safe(function(){
    settleRun();
    state = "start";
    stopMusic(); stopLevelupCountdown(); stopShopCountdown();
    overlay.classList.remove("active");
    levelupTimerEl.textContent = "";
    startScreen.classList.add("active");
    updateSkillButtons(); renderMeta();
  }));
  hudMenuBtn.addEventListener("click", safe(function(){
    hudButtonsEl.classList.toggle("open");
    hudMenuBtn.textContent = hudButtonsEl.classList.contains("open") ? "✕" : "⋯";
  }));
  pauseBtn.addEventListener("click", safe(function(){
    if(state === "playing"){ pauseGame(); }
    else if(state === "paused"){ resumeGame(); }
    else if(["stats","settings","codex"].indexOf(state) >= 0){ closePanel(); }
  }));
  statsBtn.addEventListener("click", safe(function(){ state === "stats" ? closePanel() : openPanel("stats"); }));
  codexBtn.addEventListener("click", safe(function(){ state === "codex" ? closePanel() : openPanel("codex"); }));
  settingsBtn.addEventListener("click", safe(function(){ state === "settings" ? closePanel() : openPanel("settings"); }));
  toggleSoundBtn.addEventListener("click", safe(function(){
    ensureAudio();
    settings.soundEnabled = !settings.soundEnabled;
    updateGains(); updateSoundButtons(); saveSettings();
  }));
  toggleMusicBtn.addEventListener("click", safe(function(){
    ensureAudio();
    settings.musicEnabled = !settings.musicEnabled;
    updateGains(); updateMusicPlayback(); updateSoundButtons(); saveSettings();
  }));
  soundVolEl.addEventListener("input", function(){
    settings.soundVol = clamp(parseFloat(soundVolEl.value)||0,0,1);
    updateGains(); saveSettings();
  });
  musicVolEl.addEventListener("input", function(){
    settings.musicVol = clamp(parseFloat(musicVolEl.value)||0,0,1);
    updateGains(); saveSettings();
  });
  var cr = document.getElementById("crash-reload");
  if(cr){ cr.addEventListener("click", function(){ location.reload(); }); }
  modeBtns.std.addEventListener("click", safe(function(){ mode = "std"; renderModeButtons(); saveSettings(); }));
  modeBtns.daily.addEventListener("click", safe(function(){ mode = "daily"; renderModeButtons(); saveSettings(); }));
  modeBtns.endless.addEventListener("click", safe(function(){ mode = "endless"; renderModeButtons(); saveSettings(); }));
  document.addEventListener("visibilitychange", function(){
    try{
      if(document.hidden){
        if(state === "playing"){ pauseGame(); }
        if(state === "levelup"){ stopLevelupCountdown(); }
        if(state === "shop"){ stopShopCountdown(); }
        stopMusic();
      } else {
        if(state === "levelup" && overlay.classList.contains("active")){ startLevelupCountdown(false); }
        if(state === "shop" && overlay.classList.contains("active")){ startShopCountdown(false); }
        updateMusicPlayback();
      }
    }catch(_){}
  });
  var resizeTimer = null;
  window.addEventListener("resize", function(){
    try{ setupCanvas(); }catch(_){}
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(refreshRect,120);
  });
  window.addEventListener("orientationchange", function(){
    setTimeout(function(){ try{ setupCanvas(); refreshRect(); }catch(_){} },200);
  });
  window.addEventListener("scroll", function(){ try{ refreshRect(); }catch(_){} }, {passive:true});
  window.addEventListener("pagehide", function(){ try{ settleRun(); }catch(_){} });
  window.addEventListener("beforeunload", function(){ try{ settleRun(); }catch(_){} });
}

/* ---------- 啟動 ---------- */
bindUI();
try{ loadSettings(); normalizeSettings(); }catch(err){ console.error(err); }
try{ loadStats(); }catch(err){ console.error(err); }
try{ applySettings(); }catch(err){ console.error(err); }
try{ buildSkillButtons(); }catch(err){ console.error(err); }
try{ updateSoundButtons(); updateVolumeInputs(); }catch(err){ console.error(err); }
try{ renderMeta(); }catch(err){ console.error("renderMeta 失敗",err); showCrash(err); }
try{
  resetGame();
  state = "start";
  startScreen.classList.add("active");
  updateSkillButtons();
}catch(err){
  console.error("初始化失敗",err);
  showCrash(err);
}
requestAnimationFrame(frame);

})();
</script>
